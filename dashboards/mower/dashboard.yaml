  - title: Diagnostics & Tools
    path: diagnostics
    type: panel
    icon: mdi:wrench
    cards:
      - type: vertical-stack
        cards:
          - *tab_header_diagnostics

          # 3-column grid: 5 cards in order (paired notes merged as footers).
          - type: grid
            columns: 3
            square: false
            cards:
              # `entities` footer only supports buttons/graph/picture, so
              # the explanatory markdown sits as a vertical-stack sibling.
              - type: vertical-stack
                cards:
                  - type: entities
                    title: Device identity
                    entities:
                      - entity: sensor.dreame_a2_mower_firmware_version_dev
                        name: Firmware version
                      - entity: update.dreame_a2_mower_firmware
                        name: Firmware update
                      - entity: sensor.dreame_a2_mower_ota_state
                        name: OTA state
                      - entity: sensor.dreame_a2_mower_ota_progress
                        name: OTA progress
                      - entity: sensor.dreame_a2_mower_cloud_device_id
                        name: Cloud device id
                      - entity: sensor.dreame_a2_mower_api_endpoint
                        name: API endpoint
                      - entity: sensor.dreame_a2_mower_integration_version
                        name: Integration version
                  - type: markdown
                    content: |
                      Serial number + MAC address are on the Device info card
                      (Settings → Devices → Dreame A2 Mower).

                      **Firmware update** shows the mower's own firmware
                      (installed vs latest from the Dreame cloud). When an
                      update is available the row exposes an **Install** action;
                      the mower gates it on WiFi signal + charge, so a refusal
                      means move it closer to the dock/AP and retry. **OTA
                      state / progress** track a download in flight (idle / 0%
                      when none is running).

              - type: vertical-stack
                cards:
                  - type: entities
                    title: Connectivity
                    entities:
                      - entity: sensor.dreame_a2_mower_wifi_rssi
                        name: WiFi RSSI (dBm)
                      - entity: sensor.dreame_a2_mower_wifi_ssid
                        name: WiFi SSID
                      - entity: sensor.dreame_a2_mower_wifi_ip
                        name: WiFi IP
                      - entity: sensor.dreame_a2_mower_mqtt_connectivity
                        name: MQTT connectivity
                      - entity: sensor.dreame_a2_mower_data_freshness
                        name: Data freshness (s since last update)
                  - type: markdown
                    content: |
                      - **Bluetooth:** not observable from this integration
                      - **Cellular:** g2408 has a cellular radio but no
                        cellular-status surface is exposed by the cloud API
                        we've reverse-engineered. Connectivity figures here are
                        WiFi/MQTT only.
                      - **MQTT / API protocol version:** not exposed by Dreame
                        cloud

              - type: vertical-stack
                cards:
                  - type: entities
                    title: Position (MPOS)
                    show_header_toggle: false
                    entities:
                      - entity: sensor.dreame_a2_mower_mpos
                        name: MPOS (x / y / yaw)
                      - entity: button.dreame_a2_mower_refresh_mpos
                        name: Refresh MPOS
                        icon: mdi:crosshairs-gps
                  - type: markdown
                    content: |
                      Read-only diagnostic. `x` / `y` / `yaw` are in the
                      device's raw map frame (units/orientation unverified) —
                      observe-only, not used to drive position. Tap **Refresh
                      MPOS** to re-poll.

              - type: markdown
                content: |
                  ### Novel-log buffer

                  The integration captures unknown-property and unknown-value
                  events into a ring buffer of 200 entries. Use
                  `dreame_a2_mower.download_diagnostics` (Tools tab) to
                  download.

          - *tab_header_tools

          # 4-column grid: manual | recovery | configuration | diagnostics download
          - type: grid
            columns: 4
            square: false
            cards:
              - type: entities
                title: Manual refresh
                entities:
                  - entity: button.dreame_a2_mower_refresh_from_cloud
                    name: Refresh cloud state
                  - entity: button.dreame_a2_mower_refresh_wifi_heatmaps
                    name: Refresh WiFi heatmaps
                  - entity: button.dreame_a2_mower_finalize_session
                    name: Finalize pending session

              - type: entities
                title: Recovery actions
                entities:
                  - entity: button.dreame_a2_mower_lock_robot
                    name: Lock robot
                  - entity: button.dreame_a2_mower_find_my_robot
                    name: Find robot
                  - entity: button.dreame_a2_mower_generate_3d_map
                    name: Generate 3D map
                  - entity: button.dreame_a2_mower_update_station_location
                    name: Update station location

              - type: markdown
                content: |
                  ### Configuration files

                  To install the dashboard or its required helpers:

                  - Dashboard yaml lives at `/config/dashboards/mower/dashboard.yaml`.
                    SCP from this repo's `dashboards/mower/dashboard.yaml`.
                  - Helpers (`input_number.*` for WiFi opacity and LiDAR tilt):
                    see `docs/superpowers/helpers/dreame-a2-helpers.yaml`.

              - type: markdown
                content: |
                  ### Diagnostics download

                  Service `dreame_a2_mower.download_diagnostics` writes a JSON
                  bundle (state, novel-log, recent sessions). Call from Developer
                  Tools → Services, or attach to an automation. File is written
                  under the config dir.

  - title: Photos
    path: photos
    type: panel
    icon: mdi:image-multiple
    cards:
      - type: vertical-stack
        cards:
          - *tab_header_photos

          # Counts + OSS storage at a glance.
          - type: glance
            show_name: true
            show_state: true
            columns: 5
            entities:
              - entity: sensor.dreame_a2_mower_obstacle_photos
                name: Obstacle
              - entity: sensor.dreame_a2_mower_patrol_photos
                name: Patrol
              - entity: sensor.dreame_a2_mower_person_photos
                name: Person
              - entity: sensor.dreame_a2_mower_videos
                name: Videos
              - entity: sensor.dreame_a2_mower_oss_storage_used_percent
                name: Storage %

          # Per-type "latest" cameras — newest item of each kind, for an
          # at-a-glance row above the full gallery. These follow the cloud
          # OSS sync (hourly) and may be empty until the first item lands.
          - type: horizontal-stack
            cards:
              - type: picture-entity
                entity: camera.dreame_a2_mower_latest_photo
                name: Latest photo
                show_state: false
                camera_view: auto
              - type: picture-entity
                entity: camera.dreame_a2_mower_latest_person_detection
                name: Latest person detection
                show_state: false
                camera_view: auto
              - type: picture-entity
                entity: camera.dreame_a2_mower_latest_video
                name: Latest video (thumbnail)
                show_state: false
                camera_view: auto

          # Thumbnail gallery (bundled card). REQUIRES the Lovelace resource
          # (type: module): /dreame_a2_mower/dreame-a2-photo-gallery-card.js
          # Reads sensor.dreame_a2_mower_photo_gallery's `items` attribute
          # (signed media URLs); tap a thumbnail to open the large pop-out.
          - type: custom:dreame-a2-photo-gallery-card
            entity: sensor.dreame_a2_mower_photo_gallery

          # Live "latest AI-obstacle capture" (Track B). Distinct from the
          # archive gallery above: this follows the most recent transient
          # obstacle photo the coordinator downloaded mid-mow. It may stay
          # EMPTY — the getDeiviceFile download fails closed while the signer
          # is unverified, so the card only fills once the backend returns a
          # photo. Sits beside the diagnostic obstacle-marker count.
          - type: horizontal-stack
            cards:
              - type: picture-entity
                entity: camera.dreame_a2_mower_obstacle_photo
                name: Latest AI-obstacle photo
                show_state: false
                camera_view: auto
              - type: entities
                title: Live obstacle markers
                show_header_toggle: false
                entities:
                  - entity: sensor.dreame_a2_mower_obstacle_markers
                    name: Markers this mow

          - *tab_header_photo_privacy

          # AI Photo capture + authorization warning, vertical-stacked and
          # centred at 50% width. `entities` card's `footer:` only accepts
          # buttons / graph / picture (not markdown), so the warning sits
          # as a sibling card in a vertical-stack instead.
          - type: vertical-stack
            card_mod:
              style: |
                #root {
                  width: 50%;
                  margin: 0 auto;
                }
            cards:
              - type: entities
                title: AI Photo capture
                show_header_toggle: false
                entities:
                  - entity: switch.dreame_a2_mower_ai_obstacle_photos
                    name: Capture obstacle photos
              - type: markdown
                content: |
                  > ⚠️ The toggle above only takes effect if you've
                  > **Accepted Authorization** in the Dreame app's
                  > _Capture Photos of AI-Detected Obstacles → Privacy
                  > Policy for Capturing and Transmitting Photos_ submenu.
                  > There is no way to accept the policy from Home Assistant.

          # Row 2 — 4 columns, privacy policy centred spanning cols 2-3
          # The policy text below is the one bundled with the integration
          # at custom_components/dreame_a2_mower/www/ai_obstacle_recognition_privacy.md
          # — copy-pasted inline because Lovelace markdown cards can't
          # read files. Update both places if upstream Dreame revises it.
          - type: markdown
            card_mod:
              style: |
                ha-card {
                  width: 50%;
                  margin: 0 auto;
                }
            content: |
              ## AI Obstacle Recognition Privacy Policy

                  > Source: the consent screen surfaced by the Dreame app's
                  > **Capture Photos of AI-Detected Obstacles → Privacy
                  > Policy for Capturing and Transmitting Photos**.

                  Thank you for using our AI Obstacle Recognition function.
                  Before using our services, please carefully read the
                  "Smart Robotic Mower Privacy Policy" and this privacy
                  policy.

                  Please note that during your use of the AI Obstacle
                  Recognition function, your smart robotic mower may capture
                  information about the location of the device and related
                  personnel in the vicinity, such as information about
                  people in your courtyard and the distribution of items. In
                  this process, we may collect some of your sensitive
                  personal information, such as facial recognition data. For
                  the processing of your sensitive personal information and
                  the access to relevant permissions, we will remind you to
                  pay attention in **bold** form. If you agree to this
                  privacy policy, it means you allow us to process your
                  sensitive personal information in the manner described
                  below.

                  We will provide you with one or more of the following
                  services under the AI Obstacle Recognition Alarm function:

                  1. **Automatic Obstacle Avoidance** — the robotic mower
                     can automatically avoid people, animals, and objects
                     using AI.
                  2. **Obstacle Photography** — the robotic mower will take
                     photos of recognized objects and push them to you via
                     the App.

                  Please note that if you place your mower in a private
                  space or during private activities, the videos, pictures,
                  or radar sensor data generated may still contain personal
                  information such as privacy, portrait, or facial
                  recognition information. Comply with local laws and
                  regulations that may apply to video surveillance, and pay
                  attention to the shooting angle to avoid capturing images
                  of public areas.

                  Transparency requirements while the robotic mower is
                  using these functions:

                  1. A voice prompt every 15 minutes stating "Video security
                     is in progress".
                  2. The corresponding indicator light remains flashing.

                  The AI Obstacle Recognition function starts running only
                  after you choose to turn it on. You can turn it off at any
                  time. To implement this function, you must grant the
                  camera permission to the smart robotic mower in the App.

                  The legal basis for processing your personal information
                  is your consent, which you can withdraw in accordance with
                  the "Smart Robotic Mower Privacy Policy". Refusing the
                  relevant permissions disables AI Obstacle Recognition but
                  does not affect basic mower functionality.

                  Obstacle pictures recognized by AI are displayed via a
                  server located in Germany in an encrypted media stream;
                  this server does not collect or store video. If you use
                  AI Obstacle Recognition Alarm, the videos/pictures you
                  actively capture are encrypted and stored on Alibaba
                  Cloud in Germany. Human-shape pictures are anonymized
                  before upload so the anonymized images cannot identify
                  individuals even when combined with other information.
                  You can view, download, or delete captured media in the
                  App's "Album" at any time; unselected media is auto-
                  deleted from the cloud after 30 days.

                  Non-human-shaped pictures you flag as inaccurate may be
                  used to retrain the AI for accuracy improvements. You can
                  opt out at any time via the App or by contacting Dreame.

                  For the full original text, see
                  `custom_components/dreame_a2_mower/www/ai_obstacle_recognition_privacy.md`
                  in this integration's source, or the public site:
                  https://www.dreame.tech/policy/privacy
  - title: Info
    path: info
    type: panel
    icon: mdi:message-text
    cards:
      - type: vertical-stack
        cards:
          - *tab_header_info

          - type: markdown
            title: 🤖 Device messages
            content: |
              {% set items = state_attr('sensor.dreame_a2_mower_device_messages','items') or [] %}
              **{{ items | count }} messages** retained
              {% for m in items %}
              - {{ '🔵' if m.unread else '⚪' }} **{{ m.title }}** — {% if m.date %}<small>{{ as_local(as_datetime(m.date)).strftime('%Y-%m-%d %H:%M') }}</small>{% endif %}{% if m.body %}<br>{{ m.body }}{% endif %}{% if m.link %} · [open]({{ m.link }}){% endif %}{% set ph = m.get('photos') or [] %}{% if ph %}<br>{% for p in ph %}<a href="{{ p.url }}" target="_blank"><img src="{{ p.thumb_url }}" height="72"></a> {% endfor %}{% endif %}
              {% endfor %}
              {% if not items %}_No messages_{% endif %}

          - type: markdown
            title: 📨 Service messages
            content: |
              {% set items = state_attr('sensor.dreame_a2_mower_service_messages','items') or [] %}
              **{{ states('sensor.dreame_a2_mower_service_messages') }} unread** · {{ items | count }} total
              {% for m in items %}
              - {{ '🔵' if m.unread else '⚪' }} **{{ m.title }}** — {% if m.date %}<small>{{ as_local(as_datetime(m.date)).strftime('%Y-%m-%d %H:%M') }}</small>{% endif %}{% if m.body %}<br>{{ m.body }}{% endif %}{% if m.link %} · [open]({{ m.link }}){% endif %}
              {% endfor %}
              {% if not items %}_No messages_{% endif %}

          - type: markdown
            title: 👥 Shared messages
            content: |
              {% set items = state_attr('sensor.dreame_a2_mower_shared_messages','items') or [] %}
              **{{ states('sensor.dreame_a2_mower_shared_messages') }} unread** · {{ items | count }} total
              {% for m in items %}
              - {{ '🔵' if m.unread else '⚪' }} **{{ m.title }}** — {% if m.date %}<small>{{ as_local(as_datetime(m.date)).strftime('%Y-%m-%d %H:%M') }}</small>{% endif %}{% if m.body %}<br>{{ m.body }}{% endif %}{% if m.link %} · [open]({{ m.link }}){% endif %}
              {% endfor %}
              {% if not items %}_No messages_{% endif %}


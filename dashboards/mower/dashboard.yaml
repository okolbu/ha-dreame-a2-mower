# Dreame A2 Mower — showcase dashboard
# Updated 2026-05-11 (entity_ids corrected against live HA inventory).
#
# Per-map flipping uses `select.dreame_a2_mower_active_map`'s
# `current_map_id` attribute (added in the integration via v1.0.4a2).
#
# Per-map entities are namespaced under the integration's prefix:
#   map_id=0 → `<platform>.dreame_a2_mower_map_1_<key>`
#   map_id=1 → `<platform>.dreame_a2_mower_map_2_<key>`
# Per-map sub-device names are "Dreame A2 Mower Map N" (or "Dreame A2
# Mower <user-named-map>" when the Dreame app gave the map a custom
# name). HA's has_entity_name=True composes friendly_name and slug
# from device_name + entity_name automatically — see CLAUDE.md
# § "Per-map naming convention".
#
# Required helpers (add via Settings → Devices → Helpers, or copy
# `docs/superpowers/helpers/dreame-a2-helpers.yaml` into configuration.yaml):
#   - input_number.dreame_a2_mower_wifi_overlay_opacity
#   - input_number.dreame_a2_mower_lidar_tilt
#
# Required custom cards (install via HACS Frontend):
#   - card-mod      (for WiFi overlay opacity binding)
#   - dreame-a2-lidar-card  (bundled with the integration)
#
# Required Lovelace resources (Settings → Dashboards → Resources → Add,
# type "JavaScript Module" — NOT add_extra_js_url, which is unreliable on
# YAML-mode dashboards):
#   - /dreame_a2_mower/dreame-mower-map-card.js     (animated live map)
#   - /dreame_a2_mower/dreame-mower-replay-card.js  (animated session replay)
# Both import /dreame_a2_mower/_dreame-map-core.js as an ES module — it is
# pulled in automatically, so it needs NO separate resource entry.
#
# Map count is 2 (live mower). Adding a 3rd map: copy any
# `conditional` block, change the state value to 2, and update
# entity references to match that map's registered naming.

# Per-tab title delimiter — defined here as YAML anchors, aliased from
# each tab's first card. Shape mirrors the "## 📊 Picked session — X"
# delimiter the Sessions tab uses for per-session sub-views: a 3px
# horizontal rule, then a single `##` line carrying emoji + tab name,
# optional em-dash + live value (per-map active map, archive count),
# and an inline small-grey-text helper note describing what the tab
# *is*. See docs/superpowers/specs/2026-05-16-dashboard-minor-design.md
# for the per-tab table.
#
# Small grey note uses an inline <span>; HA's markdown card passes
# inline HTML through `marked`. If a future HA version sanitizes the
# style attribute, fall back to <sub>…</sub> (always supported).

_tab_header_mower: &tab_header_mower
  type: markdown
  content: |
    <hr style="border:0;border-top:3px solid var(--primary-color);margin:12px 0 0 0;"/>

    ## 🤖 Mower — Active map: {{ states('select.dreame_a2_mower_active_map') }} &nbsp;<span style="font-size:0.75em;color:var(--secondary-text-color)">switch on Map Selector</span>

_tab_header_map_selector: &tab_header_map_selector
  type: markdown
  content: |
    <hr style="border:0;border-top:3px solid var(--primary-color);margin:12px 0 0 0;"/>

    ## 🗺️ Map Selector &nbsp;<span style="font-size:0.75em;color:var(--secondary-text-color)">drives the active map for every per-map tab</span>

_tab_header_settings_zones: &tab_header_settings_zones
  type: markdown
  content: |
    <hr style="border:0;border-top:3px solid var(--primary-color);margin:12px 0 0 0;"/>

    ## ⚙️ Settings & Zones — Active map: {{ states('select.dreame_a2_mower_active_map') }} &nbsp;<span style="font-size:0.75em;color:var(--secondary-text-color)">switch on Map Selector</span>

    <span style="font-size:0.75em;color:var(--secondary-text-color)">🔒 = control is present but the device write path isn't unlocked yet (changes snap back).</span>

_tab_header_map_editor: &tab_header_map_editor
  type: markdown
  content: |
    <hr style="border:0;border-top:3px solid var(--primary-color);margin:12px 0 0 0;"/>

    ## ✏️ Map Editor — Active map: {{ states('select.dreame_a2_mower_active_map') }} &nbsp;<span style="font-size:0.75em;color:var(--secondary-text-color)">draw / edit no-go, ignore & mow shapes — writes to the device; switch maps in-card</span>

_tab_header_schedule: &tab_header_schedule
  type: markdown
  content: |
    <hr style="border:0;border-top:3px solid var(--primary-color);margin:12px 0 0 0;"/>

    ## 📅 Schedule — Active map: {{ states('select.dreame_a2_mower_active_map') }} &nbsp;<span style="font-size:0.75em;color:var(--secondary-text-color)">edit slots in the card below — writes to the device; switch maps on Map Selector</span>

_tab_header_lidar: &tab_header_lidar
  type: markdown
  content: |
    <hr style="border:0;border-top:3px solid var(--primary-color);margin:12px 0 0 0;"/>

    ## 📡 LiDAR &nbsp;<span style="font-size:0.75em;color:var(--secondary-text-color)">archived 3-D point clouds</span>

_tab_header_wifi: &tab_header_wifi
  type: markdown
  content: |
    <hr style="border:0;border-top:3px solid var(--primary-color);margin:12px 0 0 0;"/>

    ## 📶 WiFi Coverage &nbsp;<span style="font-size:0.75em;color:var(--secondary-text-color)">signal strength as measured during mowing</span>

_tab_header_sessions: &tab_header_sessions
  type: markdown
  content: |
    <hr style="border:0;border-top:3px solid var(--primary-color);margin:12px 0 0 0;"/>

    ## 📊 Sessions — {{ states('sensor.dreame_a2_mower_archived_session_count') }} archived &nbsp;<span style="font-size:0.75em;color:var(--secondary-text-color)">calendar plus per-session breakdown</span>

_tab_header_more_settings: &tab_header_more_settings
  type: markdown
  content: |
    <hr style="border:0;border-top:3px solid var(--primary-color);margin:12px 0 0 0;"/>

    ## ⚙️ More Settings &nbsp;<span style="font-size:0.75em;color:var(--secondary-text-color)">device-wide settings (per-map ones live on Settings & Zones)</span>

_tab_header_diagnostics: &tab_header_diagnostics
  type: markdown
  content: |
    <hr style="border:0;border-top:3px solid var(--primary-color);margin:12px 0 0 0;"/>

    ## 🩺 Diagnostics &nbsp;<span style="font-size:0.75em;color:var(--secondary-text-color)">health checks and raw state</span>

_tab_header_tools: &tab_header_tools
  type: markdown
  content: |
    <hr style="border:0;border-top:3px solid var(--primary-color);margin:12px 0 0 0;"/>

    ## 🔧 Tools &nbsp;<span style="font-size:0.75em;color:var(--secondary-text-color)">helpers, services, manual ops</span>

_tab_header_photo_privacy: &tab_header_photo_privacy
  type: markdown
  content: |
    <hr style="border:0;border-top:3px solid var(--primary-color);margin:12px 0 0 0;"/>

    ## 🔒 Photo Privacy &nbsp;<span style="font-size:0.75em;color:var(--secondary-text-color)">review and delete AI-obstacle photos</span>

_tab_header_photos: &tab_header_photos
  type: markdown
  content: |
    <hr style="border:0;border-top:3px solid var(--primary-color);margin:12px 0 0 0;"/>

    ## 🖼️ Photos &nbsp;<span style="font-size:0.75em;color:var(--secondary-text-color)">archived obstacle / patrol / person photos + videos — tap a thumbnail to enlarge</span>

_tab_header_info: &tab_header_info
  type: markdown
  content: |
    <hr style="border:0;border-top:3px solid var(--primary-color);margin:12px 0 0 0;"/>

    ## 📨 Messages &nbsp;<span style="font-size:0.75em;color:var(--secondary-text-color)">device, service &amp; sharing messages from the Dreame cloud</span>

title: Dreame A2 Mower

# Custom cards used by this dashboard — register these as Lovelace
# resources via Settings → Dashboards → ⋮ → Resources. Per-dashboard
# YAML files cannot self-declare resources; the Resources UI is the
# authoritative source.
#
#   /hacsfiles/atomic-calendar-revive/atomic-calendar-revive.js (module)
#   /dreame_a2_mower/dreame-a2-lidar-card.js (module)
#   /dreame_a2_mower/dreame-a2-schedule-card.js (module)
#   - /dreame_a2_mower/dreame-multi-select-card.js  (generic multi-select; register as JavaScript Module)

views:
  - title: Overview
    path: overview
    type: panel
    icon: mdi:robot-mower-outline
    cards:
      - type: vertical-stack
        cards:
          # Header
          - *tab_header_mower

          # PIN-required emergency-stop banner
          - type: conditional
            conditions:
              - entity: binary_sensor.dreame_a2_mower_emergency_stop_activated
                state: "on"
            card:
              type: markdown
              content: |
                ## ⚠️ Emergency stop activated
                Enter the PIN code on the robot to unlock it. The mower
                will not mow until the PIN is accepted.

          # Row 1 — 2 columns: State (left) | Live Map (right)
          - type: grid
            columns: 2
            square: false
            cards:
              # State + sensors — surfaces the v1.0.8 state-machine entities
              # (current_activity, location, positioning_health, mqtt connectivity)
              # alongside battery + session area + the legacy in-dock / obstacle / rain flags.
              - type: entities
                title: State
                entities:
                  - entity: lawn_mower.dreame_a2_mower
                  - entity: sensor.dreame_a2_mower_current_activity
                  - entity: sensor.dreame_a2_mower_location
                  - entity: binary_sensor.dreame_a2_mower_mowing_session_active
                    name: Mowing session active
                  - entity: sensor.dreame_a2_mower_battery
                  - entity: sensor.dreame_a2_mower_charging_status
                  - entity: binary_sensor.dreame_a2_mower_mower_in_dock
                    name: In dock
                  - entity: sensor.dreame_a2_mower_positioning_health
                  - entity: sensor.dreame_a2_mower_mqtt_connectivity
                  - entity: binary_sensor.dreame_a2_mower_obstacle_detected
                  - entity: binary_sensor.dreame_a2_mower_rain_protection_active
                  - entity: sensor.dreame_a2_mower_active_selection
                  - entity: sensor.dreame_a2_mower_area_mowed
                    name: Session area mowed (m²)
                  - entity: number.dreame_a2_mower_trail_render_width
                    name: Trail width (px)
              # Per-zone mow progress (s2p56 zone_progress) — shows each
              # target's stage on a multi-zone mow with wire zone names.
              - type: markdown
                title: Zone progress
                content: >
                  {% set z = state_attr('sensor.dreame_a2_mower_zone_progress','zones') %}
                  {% if z %}{% for zone in z %}
                  {{ '✅' if zone.status=='done' else ('🟢' if zone.status=='active' else '⚪') }} {{ zone.name }}
                  {% endfor %}{% else %}Idle{% endif %}
              # Hero: animated live map for the active map. The custom
              # dreame-mower-map-card draws the base PNG + a client-side
              # accumulated trail + a directional mower icon animated
              # between the coordinator's ~5s position pushes (reading
              # camera.dreame_a2_mower_map's published stream attributes).
              # REQUIRES the Lovelace resource (type: module):
              #   /dreame_a2_mower/dreame-mower-map-card.js
              # (it imports _dreame-map-core.js; no separate resource entry
              # needed). Registered as a normal resource — NOT via
              # add_extra_js_url (that proved unreliable on YAML-mode
              # dashboards — see README).
              - type: custom:dreame-mower-map-card
                entity: camera.dreame_a2_mower_map

          # Mowing target — single dropdown bound to the action mode; the
          # per-type target picker shows below based on the chosen mode.
          # Zone/Spot/Edge selects are per-active-map; we render the picker
          # for whichever map is currently active.
          # Placed ABOVE the action-button row so the user picks WHAT to mow
          # before being offered the buttons to start/pause/recharge.
          - type: entities
            title: Mowing target
            entities:
              - entity: select.dreame_a2_mower_action_mode
                name: Mode
          # Zone target — split by active map
          - type: conditional
            conditions:
              - entity: select.dreame_a2_mower_action_mode
                state: zone
              - entity: select.dreame_a2_mower_active_map
                attribute: current_map_id
                state: 0
            card:
              type: entities
              entities:
                - entity: select.dreame_a2_mower_map_1_zone
                  name: Zone
          - type: conditional
            conditions:
              - entity: select.dreame_a2_mower_action_mode
                state: zone
              - entity: select.dreame_a2_mower_active_map
                attribute: current_map_id
                state: 1
            card:
              type: entities
              entities:
                - entity: select.dreame_a2_mower_map_2_zone
                  name: Zone
          # Spot target — split by active map
          - type: conditional
            conditions:
              - entity: select.dreame_a2_mower_action_mode
                state: spot
              - entity: select.dreame_a2_mower_active_map
                attribute: current_map_id
                state: 0
            card:
              type: entities
              entities:
                - entity: select.dreame_a2_mower_map_1_spot
                  name: Spot
          - type: conditional
            conditions:
              - entity: select.dreame_a2_mower_action_mode
                state: spot
              - entity: select.dreame_a2_mower_active_map
                attribute: current_map_id
                state: 1
            card:
              type: entities
              entities:
                - entity: select.dreame_a2_mower_map_2_spot
                  name: Spot
          # Edge target — split by active map
          - type: conditional
            conditions:
              - entity: select.dreame_a2_mower_action_mode
                state: edge
              - entity: select.dreame_a2_mower_active_map
                attribute: current_map_id
                state: 0
            card:
              type: entities
              entities:
                - entity: select.dreame_a2_mower_map_1_edge
                  name: Edge
          - type: conditional
            conditions:
              - entity: select.dreame_a2_mower_action_mode
                state: edge
              - entity: select.dreame_a2_mower_active_map
                attribute: current_map_id
                state: 1
            card:
              type: entities
              entities:
                - entity: select.dreame_a2_mower_map_2_edge
                  name: Edge

          # Action row — state-aware. Rows are mutually exclusive based on
          # (current_activity, charging_status, in_dock, mowing_session_active).
          # Find Robot lives on the Tools tab under Recovery actions.

          # Row: Charging in mow → Continue · End
          - type: conditional
            conditions:
              - entity: binary_sensor.dreame_a2_mower_mowing_session_active
                state: "on"
              - entity: sensor.dreame_a2_mower_charging_status
                state: charging
            card:
              type: horizontal-stack
              cards:
                - type: button
                  entity: button.dreame_a2_mower_start_mowing
                  icon: mdi:play
                  name: Continue
                  show_state: false
                - type: button
                  entity: button.dreame_a2_mower_stop
                  icon: mdi:stop
                  name: End
                  show_state: false

          # Row: Charging not in mow → Start
          - type: conditional
            conditions:
              - entity: binary_sensor.dreame_a2_mower_mowing_session_active
                state: "off"
              - entity: sensor.dreame_a2_mower_charging_status
                state: charging
            card:
              type: horizontal-stack
              cards:
                - type: button
                  entity: button.dreame_a2_mower_start_mowing
                  icon: mdi:play
                  name: Start
                  show_state: false

          # Row: In dock, not charging → Start · Recharge
          - type: conditional
            conditions:
              - entity: binary_sensor.dreame_a2_mower_mower_in_dock
                state: "on"
              - entity: sensor.dreame_a2_mower_charging_status
                state: not_charging
              - entity: binary_sensor.dreame_a2_mower_mowing_session_active
                state: "off"
            card:
              type: horizontal-stack
              cards:
                - type: button
                  entity: button.dreame_a2_mower_start_mowing
                  icon: mdi:play
                  name: Start
                  show_state: false
                - type: button
                  entity: button.dreame_a2_mower_recharge
                  icon: mdi:battery-charging
                  name: Recharge
                  show_state: false

          # Row: Doing-something (mowing / cruising / mapping) → Pause · End · Recharge
          # (`returning` is handled by its own row below so Cancel dock return
          # can be offered without showing it mid-mow.)
          - type: conditional
            conditions:
              - entity: sensor.dreame_a2_mower_current_activity
                state:
                  - mowing
                  - cruising_to_point
                  - fast_mapping
                  - repositioning
            card:
              type: horizontal-stack
              cards:
                - type: button
                  entity: button.dreame_a2_mower_pause
                  icon: mdi:pause
                  name: Pause
                  show_state: false
                - type: button
                  entity: button.dreame_a2_mower_stop
                  icon: mdi:stop
                  name: End
                  show_state: false
                - type: button
                  entity: button.dreame_a2_mower_recharge
                  icon: mdi:battery-charging
                  name: Recharge
                  show_state: false

          # Row: Returning to dock → Pause · Cancel dock return · End
          - type: conditional
            conditions:
              - entity: sensor.dreame_a2_mower_current_activity
                state: returning
            card:
              type: horizontal-stack
              cards:
                - type: button
                  entity: button.dreame_a2_mower_pause
                  icon: mdi:pause
                  name: Pause
                  show_state: false
                - type: button
                  entity: button.dreame_a2_mower_cancel_dock_return
                  icon: mdi:keyboard-return
                  name: Cancel dock return
                  show_state: false
                - type: button
                  entity: button.dreame_a2_mower_stop
                  icon: mdi:stop
                  name: End
                  show_state: false

          # Row: Paused in session → Resume · Continue · End · Recharge
          # Resume (op=5) un-pauses the current session; "Continue" (start_mowing)
          # is the legacy verb kept for parity. Both are surfaced.
          - type: conditional
            conditions:
              - entity: sensor.dreame_a2_mower_current_activity
                state: paused
            card:
              type: horizontal-stack
              cards:
                - type: button
                  entity: button.dreame_a2_mower_resume
                  icon: mdi:play-circle
                  name: Resume
                  show_state: false
                - type: button
                  entity: button.dreame_a2_mower_start_mowing
                  icon: mdi:play
                  name: Continue
                  show_state: false
                - type: button
                  entity: button.dreame_a2_mower_stop
                  icon: mdi:stop
                  name: End
                  show_state: false
                - type: button
                  entity: button.dreame_a2_mower_recharge
                  icon: mdi:battery-charging
                  name: Recharge
                  show_state: false

          # Row: Stopped on lawn idle (error / arrived at maintenance point) → Start · Recharge
          # Idle out on the lawn (e.g. arrived at a maintenance point, not in a
          # session): offer Start (begin a mow from here) alongside Recharge.
          # Matches both `idle` and `at_point` — the arrived-at-point activity is
          # `at_point`, not `idle`, in current builds.
          - type: conditional
            conditions:
              - entity: sensor.dreame_a2_mower_current_activity
                state:
                  - idle
                  - at_point
              - entity: binary_sensor.dreame_a2_mower_mower_in_dock
                state: "off"
              - entity: binary_sensor.dreame_a2_mower_mowing_session_active
                state: "off"
            card:
              type: horizontal-stack
              cards:
                - type: button
                  entity: button.dreame_a2_mower_start_mowing
                  icon: mdi:play
                  name: Start
                  show_state: false
                - type: button
                  entity: button.dreame_a2_mower_recharge
                  icon: mdi:battery-charging
                  name: Recharge
                  show_state: false

          # Row 3 — 3 columns: Mower activity | GPS Tracking | Head to Maintenance Point
          - type: grid
            columns: 3
            square: false
            cards:
              # Filtered activity timeline. Backed by the integration's two
              # event entities (lifecycle = mowing-started/paused/resumed/ended,
              # dock arrived/departed; alert = the s2p2 notification codes
              # like rain_protection / low_battery_return / stuck etc).
              # Distinct from the full device Activity panel which lists every
              # state change — this view is curated to the events the user
              # actually cares about being notified of.
              #
              # NOTE: each event currently shows TWICE in the logbook — once as
              # the EventEntity state change (rendered with a generic message),
              # once as the integration's bus event (rendered with the proper
              # human message via custom_components/dreame_a2_mower/logbook.py).
              # HA's logbook component bypasses async_describe_event for state
              # changes, so the only way to suppress the duplicate is via
              # configuration.yaml's logbook exclude list:
              #
              #   logbook:
              #     exclude:
              #       entities:
              #         - event.dreame_a2_mower_lifecycle
              #         - event.dreame_a2_mower_alert
              #
              # That keeps the entities live (so templates and automations can
              # still trigger on them) while removing the duplicate logbook
              # entries.
              - type: logbook
                title: Mower activity
                hours_to_show: 48
                entities:
                  - event.dreame_a2_mower_lifecycle
                  - event.dreame_a2_mower_alert

              # GPS map — absolute position from the cloud location/getRecords
              # endpoint, refreshed every 60 s (_refresh_gps → device_tracker
              # with standard latitude/longitude attrs). Shipped v1.0.25a3.
              - type: map
                title: GPS Location
                default_zoom: 17
                hours_to_show: 0
                entities:
                  - device_tracker.dreame_a2_mower_location

              # Head to Maintenance Point — follows the active map by matching the
              # active_map select's STATE ("Map 1"/"Map 2") — plain string equality,
              # which the conditional card reliably supports (the `attribute:
              # current_map_id` shorthand silently drops the attribute and compares
              # the entity STATE, so it never matched). Direct grid children, no
              # vertical-stack. op=109 live-confirmed 2026-05-31 (inventory.yaml o109).
              # NOTE: matches by map NAME — if you rename a map, update the `state:`
              # values below.
              - type: conditional
                conditions:
                  - entity: select.dreame_a2_mower_active_map
                    state: "Map 1"
                card:
                  type: entities
                  title: Head to Maintenance Point
                  show_header_toggle: false
                  entities:
                    - entity: select.dreame_a2_mower_map_1_maintenance_point
                      name: Point
                    - entity: button.dreame_a2_mower_map_1_head_to_point
                      name: Head to point
                      icon: mdi:map-marker-right
              - type: conditional
                conditions:
                  - entity: select.dreame_a2_mower_active_map
                    state: "Map 2"
                card:
                  type: entities
                  title: Head to Maintenance Point
                  show_header_toggle: false
                  entities:
                    - entity: select.dreame_a2_mower_map_2_maintenance_point
                      name: Point
                    - entity: button.dreame_a2_mower_map_2_head_to_point
                      name: Head to point
                      icon: mdi:map-marker-right

  - title: Maps & Zones
    path: maps
    type: panel
    icon: mdi:map-marker-multiple
    cards:
      - type: vertical-stack
        cards:
          - *tab_header_map_selector

          # ─── Active map preview: middle 50% width, centred ───
          # Bound to `camera.dreame_a2_mower_map` which is the integration's
          # live "current active map" camera — it swaps automatically when
          # the active-map selection changes, so the picker tiles below stay
          # visually identical while this preview reflects the choice. The
          # picture-entity `name:` field does NOT evaluate Jinja, so the
          # active-map name is provided by the markdown caption above it.
          - type: markdown
            content: |
              ### 🟢 Active map: {{ states('select.dreame_a2_mower_active_map') }}
            card_mod:
              style: |
                ha-card {
                  width: 50%;
                  margin: 0 auto;
                  text-align: center;
                }
          - type: picture-entity
            entity: camera.dreame_a2_mower_map
            show_state: false
            show_name: false
            camera_view: auto
            tap_action:
              action: more-info
            card_mod:
              style: |
                ha-card {
                  width: 50%;
                  margin: 0 auto;
                }

          # ─── Sub-tab delimiter ───
          - type: markdown
            content: |
              <hr style="border:0;border-top:2px dashed var(--divider-color);margin:16px 0 4px 0;"/>

              #### 👇 Pick a map below to make it the active map

          # ─── Picker grid: 4 columns, all tiles visually identical ───
          # Click any tile to set it active. The big preview above swaps
          # to reflect the new selection; the tiles themselves stay the
          # same. Empty trailing cells until more maps are added.
          - type: grid
            columns: 4
            square: false
            cards:
              - type: vertical-stack
                cards:
                  - type: picture-entity
                    entity: camera.dreame_a2_mower_map_1_base
                    show_state: false
                    show_name: false
                    camera_view: auto
                    tap_action:
                      action: call-service
                      service: select.select_option
                      target:
                        entity_id: select.dreame_a2_mower_active_map
                      data:
                        option: "Map 1"
                  - type: markdown
                    content: |
                      **Map 1** — {{ '%.2f' | format(states('sensor.dreame_a2_mower_map_1_area') | float(0)) }} m²

              - type: vertical-stack
                cards:
                  - type: picture-entity
                    entity: camera.dreame_a2_mower_map_2_base
                    show_state: false
                    show_name: false
                    camera_view: auto
                    tap_action:
                      action: call-service
                      service: select.select_option
                      target:
                        entity_id: select.dreame_a2_mower_active_map
                      data:
                        option: "Map 2"
                  - type: markdown
                    content: |
                      **Map 2** — {{ '%.2f' | format(states('sensor.dreame_a2_mower_map_2_area') | float(0)) }} m²

          - *tab_header_settings_zones

          # 3-column grid: zone counts (col 1) | custom mode (col 2) | pathway obstacle (col 3)
          - type: grid
            columns: 3
            square: false
            cards:
              # Col 1 — all existing per-map content stacked
              - type: vertical-stack
                cards:
                  # ───── Col 1 — Base map + Zone editor + Read-only note ─────
                  - type: conditional
                    conditions:
                      - entity: select.dreame_a2_mower_active_map
                        attribute: current_map_id
                        state: "0"
                    card:
                      type: picture-entity
                      entity: camera.dreame_a2_mower_map_1_base
                      name: "Map 1 — base"
                      camera_view: auto
                      show_state: false
                      tap_action:
                        action: more-info
                  - type: conditional
                    conditions:
                      - entity: select.dreame_a2_mower_active_map
                        attribute: current_map_id
                        state: "1"
                    card:
                      type: picture-entity
                      entity: camera.dreame_a2_mower_map_2_base
                      name: "Map 2 — base"
                      camera_view: auto
                      show_state: false
                      tap_action:
                        action: more-info
                  - type: conditional
                    conditions:
                      - entity: select.dreame_a2_mower_active_map
                        attribute: current_map_id
                        state: "0"
                    card:
                      type: entities
                      title: Zone editor (Map 1)
                      entities:
                        - entity: select.dreame_a2_mower_map_1_zone
                          name: Zone target
                        - entity: select.dreame_a2_mower_map_1_spot
                          name: Spot target
                        - entity: select.dreame_a2_mower_map_1_edge
                          name: Edge target
                  - type: conditional
                    conditions:
                      - entity: select.dreame_a2_mower_active_map
                        attribute: current_map_id
                        state: "1"
                    card:
                      type: entities
                      title: Zone editor (Map 2)
                      entities:
                        - entity: select.dreame_a2_mower_map_2_zone
                          name: Zone target
                        - entity: select.dreame_a2_mower_map_2_spot
                          name: Spot target
                        - entity: select.dreame_a2_mower_map_2_edge
                          name: Edge target
                  - type: markdown
                    content: >
                      Zone targets above pick which saved zone/spot/edge the next
                      run uses. To **draw or delete** no-go / ignore / mow shapes,
                      use the **Map Editor** tab — those edits write to the device.

              # ───── Col 2 — General Mode (per-map) ─────
              # Ordered to match the Dreame app's per-map Settings page
              # (OLD/APP_INFO.txt "Settings in General Mode"). Per-map slugs
              # differ between Map 1 (older key-derived ids — entity rename
              # orphans never cleaned up) and Map 2 (newer name-derived ids
              # from has_entity_name=True). Both maps' switches work; the
              # entity_ids are just inconsistent.
              - type: vertical-stack
                cards:
                  - type: conditional
                    conditions:
                      # State-based match ("Map 1"/"Map 2"), not the legacy
                      # conditional card's `attribute:` shorthand which it
                      # silently ignores (comparing entity STATE instead) — see
                      # the Head-to-Maintenance card comment above.
                      - entity: select.dreame_a2_mower_active_map
                        state: "Map 1"
                    card:
                      type: entities
                      title: General Mode (Map 1)
                      entities:
                        - entity: select.dreame_a2_mower_map_1_mowing_efficiency
                        - entity: select.dreame_a2_mower_map_1_mowing_mode
                        - entity: number.dreame_a2_mower_map_1_mowing_height
                        - entity: select.dreame_a2_mower_map_1_mowing_direction
                        - entity: select.dreame_a2_mower_map_1_mowing_pattern
                        - entity: select.dreame_a2_mower_map_1_turning_method
                        - entity: select.dreame_a2_mower_map_1_edge_walk_mode
                        - entity: switch.dreame_a2_mower_map_1_automatic_edge_mowing
                        - entity: switch.dreame_a2_mower_map_1_safe_edge_mowing
                        - entity: switch.dreame_a2_mower_map_1_edgemaster
                        - entity: switch.dreame_a2_mower_map_1_obstacle_avoidance_on_edges
                        - entity: switch.dreame_a2_mower_map_1_lidar_obstacle_recognition
                        - entity: number.dreame_a2_mower_map_1_obstacle_avoidance_height
                        - entity: switch.dreame_a2_mower_map_1_ai_obstacle_recognition_humans
                        - entity: switch.dreame_a2_mower_map_1_ai_obstacle_recognition_animals
                        - entity: switch.dreame_a2_mower_map_1_ai_obstacle_recognition_objects
                        - entity: number.dreame_a2_mower_map_1_obstacle_avoidance_distance
                  - type: conditional
                    conditions:
                      - entity: select.dreame_a2_mower_active_map
                        state: "Map 2"
                    card:
                      type: entities
                      title: General Mode (Map 2)
                      entities:
                        - entity: select.dreame_a2_mower_map_2_mowing_efficiency
                        - entity: select.dreame_a2_mower_map_2_mowing_mode
                        - entity: number.dreame_a2_mower_map_2_mowing_height
                        - entity: select.dreame_a2_mower_map_2_mowing_direction
                        - entity: select.dreame_a2_mower_map_2_mowing_pattern
                        - entity: select.dreame_a2_mower_map_2_turning_method
                        - entity: select.dreame_a2_mower_map_2_edge_walk_mode
                        - entity: switch.dreame_a2_mower_map_2_automatic_edge_mowing
                        - entity: switch.dreame_a2_mower_map_2_safe_edge_mowing
                        - entity: switch.dreame_a2_mower_map_2_edgemaster
                        - entity: switch.dreame_a2_mower_map_2_obstacle_avoidance_on_edges
                        - entity: switch.dreame_a2_mower_map_2_lidar_obstacle_recognition
                        - entity: number.dreame_a2_mower_map_2_obstacle_avoidance_height
                        - entity: switch.dreame_a2_mower_map_2_ai_obstacle_recognition_humans
                        - entity: switch.dreame_a2_mower_map_2_ai_obstacle_recognition_animals
                        - entity: switch.dreame_a2_mower_map_2_ai_obstacle_recognition_objects
                        - entity: number.dreame_a2_mower_map_2_obstacle_avoidance_distance

              # ───── Col 3 — Zone counts + Plan 2 placeholders ─────
              - type: vertical-stack
                cards:
                  # Zone counts — auto-entities glob over the per-map count
                  # sensors (replaces the former hand-listed 8-row block).
                  # REQUIRES the Lovelace resource (type: module):
                  #   /hacsfiles/lovelace-auto-entities/auto-entities.js
                  - type: custom:auto-entities
                    card:
                      type: entities
                      title: Zone counts
                      show_header_toggle: false
                    filter:
                      include:
                        - entity_id: sensor.dreame_a2_mower_map_*_exclusion_zones
                        - entity_id: sensor.dreame_a2_mower_map_*_ignore_obstacle_zones
                        - entity_id: sensor.dreame_a2_mower_map_*_maintenance_points
                        - entity_id: sensor.dreame_a2_mower_map_*_spots
                      exclude: []
                    sort:
                      method: entity_id
                  - type: markdown
                    content: |
                      ### 🚧 Custom Mode (Plan 2)

                      Per-zone settings overrides. Read via
                      `sensor.dreame_a2_mower_map_N_custom_mode_overrides`
                      (state attributes list zones with overrides). Write via
                      services `dreame_a2_mower.set_zone_setting(map_id,
                      zone_id, key, value)` and
                      `dreame_a2_mower.clear_zone_setting(map_id, zone_id, key)`.
                  - type: markdown
                    content: |
                      ### 🚧 Pathway Obstacle Avoidance (Plan 2)

                      Per-map switch + sub-numbers for sensitivity/threshold.
                  - type: custom:dreame-multi-select-card
                    title: Point Patrol — Map 1
                    entity: sensor.dreame_a2_mower_map_1_patrol_points
                    service: dreame_a2_mower.start_point_patrol
                    id_param: point_ids
                    map_id: 0
                    action_label: Start point patrol
                  - type: custom:dreame-multi-select-card
                    title: Edge Patrol — Map 1
                    entity: sensor.dreame_a2_mower_map_1_patrol_edges
                    service: dreame_a2_mower.start_edge_patrol
                    id_param: contour_ids
                    map_id: 0
                    action_label: Start edge patrol
                  - type: custom:dreame-multi-select-card
                    title: Point Patrol — Map 2
                    entity: sensor.dreame_a2_mower_map_2_patrol_points
                    service: dreame_a2_mower.start_point_patrol
                    id_param: point_ids
                    map_id: 1
                    action_label: Start point patrol
                  - type: custom:dreame-multi-select-card
                    title: Edge Patrol — Map 2
                    entity: sensor.dreame_a2_mower_map_2_patrol_edges
                    service: dreame_a2_mower.start_edge_patrol
                    id_param: contour_ids
                    map_id: 1
                    action_label: Start edge patrol

          - *tab_header_map_editor

          # Interactive map-editor card (bundled, served from the integration
          # static path). REQUIRES the Lovelace resource (type: module):
          #   /dreame_a2_mower/dreame-map-editor-card.js
          # (it imports _dreame-map-core.js + _dreame-map-edit-geom.js as ES
          # modules — both are pulled in automatically, no separate resource
          # entries needed.) Reads camera.dreame_a2_mower_map's map_projection,
          # entity_picture, editable_objects, map_id, available_map_ids.
          #
          # Workflow: pick a tool in the toolbar, click the map to drop a
          # shape (or click an existing no-go/ignore overlay to select it),
          # use the bounding-box handles to resize/rotate/move, then Create
          # (new) / Save (edit-in-place) / Delete. The map-id selector in the
          # toolbar chooses which map the edit targets (defaults to active).
          - type: custom:dreame-map-editor-card
            entity: camera.dreame_a2_mower_map

          - type: markdown
            content: |
              ### How it works
              - **No-go** (rectangle / circle / line / polygon) and
                **ignore-obstacle** (polygon) shapes can be **created, edited
                in place, moved, resized, rotated, and deleted**.
              - **Mow-shapes** (square / circle / heart / triangle / teardrop /
                mushroom / cloud / rainbow) are **create-only** — the cloud
                doesn't expose existing ones for selection yet.
              - Edits go straight to the mower via the
                `dreame_a2_mower.create_no_go_zone` /
                `create_ignore_obstacle` / `create_mow_shape` /
                `delete_map_object` services. After a successful write the
                overlay refreshes on the next camera update (~10 min, or sooner
                if a session is active).
              - Overlays should sit exactly over the areas baked into the map
                image. If they look offset, the map projection is stale — let
                the camera refresh, don't re-draw to compensate.

  - title: Schedule
    path: schedule
    type: panel
    icon: mdi:calendar-clock
    cards:
      - type: vertical-stack
        cards:
          - *tab_header_schedule

          # 2-column layout: tall calendar (left) | stacked slots + device-wide (right)
          - type: grid
            columns: 2
            square: false
            cards:
              # Col 1 — Weekly grid. `custom:dreame-a2-schedule-card` is bundled
              # with the integration at /www/dreame-a2-schedule-card.js. It
              # renders the per-slot `plans` (time + days + mode) as a 7-day
              # grid. The card is tall; the right column stacks two cards
              # beside it instead of starting a new row.
              - type: custom:dreame-a2-schedule-card
                sensor: sensor.dreame_a2_mower_schedule_count

              # Col 2 — vertical stack of slots list (top) + device-wide
              # time windows (bottom).
              - type: vertical-stack
                cards:
                  - type: markdown
                    content: >-
                      ### Slots


                      {% set slots = state_attr('sensor.dreame_a2_mower_schedule_count', 'slots') or [] %}

                      {% if not slots %}

                      _No schedule slots configured._

                      {% else %}

                      {% for s in slots %}

                      **Slot {{ s.slot_id }} — {{ s.name }}**

                      {% for p in s.plans %}

                      - `{{ p.time }}` · {{ p.days | join(', ') }} · {{ p.action }}{% if p.zone_id %} (zone {{ p.zone_id }}){% endif %}

                      {% endfor %}


                      {% endfor %}

                      {% endif %}

                  - type: entities
                    title: Device-wide time windows
                    entities:
                      - entity: time.dreame_a2_mower_dnd_start_time
                        name: DnD start
                      - entity: time.dreame_a2_mower_dnd_end_time
                        name: DnD end
                      - entity: time.dreame_a2_mower_low_speed_at_night_start_time
                        name: Low-speed start
                      - entity: time.dreame_a2_mower_low_speed_at_night_end_time
                        name: Low-speed end
                      - entity: time.dreame_a2_mower_charging_start_time
                        name: Charging start
                      - entity: time.dreame_a2_mower_charging_end_time
                        name: Charging end

  - title: Sessions & History
    path: sessions
    type: panel
    icon: mdi:history
    cards:
      - type: vertical-stack
        cards:
          - *tab_header_sessions
          # ───── Top row: cross-session widgets (left) + big replay map (right) ─────
          # card_mod override: align-items:flex-start so the picture-entity
          # in the right column doesn't stretch vertically to match the tall
          # left column. The picture card now ends at its image's bottom
          # (about 828 px square), and the area below it next to the rest
          # of the left column is empty page background. Trade-off vs. the
          # previous "tall picture card with white space below the image":
          # same total whitespace, just outside the card frame instead of
          # inside it.
          - type: horizontal-stack
            card_mod:
              style: |
                #root {
                  align-items: flex-start !important;
                }
            cards:
              - type: vertical-stack
                cards:
                  - type: custom:atomic-calendar-revive
                    name: Mowing sessions
                    defaultMode: Calendar
                    maxDaysToShow: 31
                    showColors: true
                    showLocation: false
                    showRelativeTime: false
                    entities:
                      - entity: calendar.dreame_a2_mower_sessions
                        icon: mdi:robot-mower
                  - type: entities
                    title: Replay picker
                    entities:
                      - entity: select.dreame_a2_mower_work_log
                        name: Session
                      - entity: input_boolean.dreame_a2_mower_animate_session
                        name: Animate replay (≤30s SVG)
                      - entity: number.dreame_a2_mower_trail_render_width
                        name: Trail width (px)
                  - type: entities
                    title: Latest archived
                    entities:
                      - entity: sensor.dreame_a2_mower_latest_session_duration
                        name: Latest duration
                      - entity: sensor.dreame_a2_mower_latest_session_area
                        name: Latest area mowed (m²)
                      - entity: sensor.dreame_a2_mower_latest_session_time
                        name: Latest started at
                      - entity: sensor.dreame_a2_mower_archived_session_count
                        name: Archived count
                  - type: conditional
                    conditions:
                      - entity: binary_sensor.dreame_a2_mower_mowing_session_active
                        state: "on"
                    card:
                      type: entities
                      title: Live session
                      entities:
                        - entity: sensor.dreame_a2_mower_session_distance
                          name: Distance (m)
                        - entity: sensor.dreame_a2_mower_session_track_point_count
                          name: Track points
                  - type: entities
                    title: Per-map session totals
                    entities:
                      - entity: sensor.dreame_a2_mower_map_1_total_area_mowed
                        name: Map 1 — total area mowed
                      - entity: sensor.dreame_a2_mower_map_1_total_mowing_time
                        name: Map 1 — total time
                      - entity: sensor.dreame_a2_mower_map_1_mowing_sessions
                        name: Map 1 — sessions
                      - entity: sensor.dreame_a2_mower_map_2_total_area_mowed
                        name: Map 2 — total area mowed
                      - entity: sensor.dreame_a2_mower_map_2_total_mowing_time
                        name: Map 2 — total time
                      - entity: sensor.dreame_a2_mower_map_2_mowing_sessions
                        name: Map 2 — sessions
              # Static work-log image (default). Toggle ON the
              # input_boolean.dreame_a2_mower_animate_session helper to
              # switch to the animated SVG replay below.
              - type: conditional
                conditions:
                  - entity: input_boolean.dreame_a2_mower_animate_session
                    state: "off"
                # Static work-log image (built-in picture-entity; reliable).
                # See the live-map card above for why the custom live-image
                # card was reverted.
                card:
                  type: picture-entity
                  entity: camera.dreame_a2_mower_work_log
                  show_state: false
                  show_name: false
                  camera_view: auto
                  tap_action:
                    action: more-info
              # Animated SVG replay (custom card). Mounts when the toggle
              # is ON. The card reads the picked-session sensor's legs,
              # state_samples, map_projection, and base_map_image_url
              # attributes to draw the trail over the base map in <=30s.
              - type: conditional
                conditions:
                  - entity: input_boolean.dreame_a2_mower_animate_session
                    state: "on"
                card:
                  type: custom:dreame-mower-replay-card
                  entity: sensor.dreame_a2_mower_picked_session

          # ───── Visible divider + per-session content (conditional) ─────
          - type: conditional
            conditions:
              - entity: select.dreame_a2_mower_work_log
                state_not: "(pick a session)"
            card:
              type: vertical-stack
              cards:
                - type: markdown
                  content: |
                    <hr style="border:0;border-top:3px solid var(--primary-color);margin:12px 0 0 0;"/>

                    ## 📊 Picked session — {{ states('sensor.dreame_a2_mower_picked_session') }}

                # 4-up detail cards
                - type: grid
                  columns: 4
                  square: false
                  cards:
                    - type: markdown
                      content: |
                        ### Identity & outcome
                        **Started**: {{ state_attr('sensor.dreame_a2_mower_picked_session','started_at') }}
                        **Ended**: {{ state_attr('sensor.dreame_a2_mower_picked_session','ended_at') }}
                        **Mowing time**: {{ state_attr('sensor.dreame_a2_mower_picked_session','duration_min') }} min (elapsed {{ state_attr('sensor.dreame_a2_mower_picked_session','elapsed_min') }} min)
                        **Mode**: {{ state_attr('sensor.dreame_a2_mower_picked_session','mode_label') }}
                        **Trigger**: {{ state_attr('sensor.dreame_a2_mower_picked_session','start_mode_label') }}
                        **Strategy**: {{ state_attr('sensor.dreame_a2_mower_picked_session','pre_type_label') }}
                        **Outcome**: {{ state_attr('sensor.dreame_a2_mower_picked_session','result_label') }} — {{ state_attr('sensor.dreame_a2_mower_picked_session','stop_reason_label') }}
                        **Completed**: {{ '✅' if state_attr('sensor.dreame_a2_mower_picked_session','completed') else '❌' }}
                    - type: markdown
                      content: |
                        ### Coverage & efficiency
                        **Area mowed**: {{ state_attr('sensor.dreame_a2_mower_picked_session','area_mowed_m2') }} m² of {{ state_attr('sensor.dreame_a2_mower_picked_session','map_area_m2') }} m²
                        **Coverage**: {{ '%.1f'|format(state_attr('sensor.dreame_a2_mower_picked_session','coverage_pct')) if state_attr('sensor.dreame_a2_mower_picked_session','coverage_pct') else '—' }} %
                        **Distance**: {{ '%.0f'|format(state_attr('sensor.dreame_a2_mower_picked_session','distance_m')) if state_attr('sensor.dreame_a2_mower_picked_session','distance_m') else '—' }} m
                        **Height**: {{ state_attr('sensor.dreame_a2_mower_picked_session','mowing_height_mm') }} mm
                        **Efficiency**: {{ state_attr('sensor.dreame_a2_mower_picked_session','mowing_efficiency_label') }}
                        **m²/min**: {{ '%.2f'|format(state_attr('sensor.dreame_a2_mower_picked_session','m2_per_min')) if state_attr('sensor.dreame_a2_mower_picked_session','m2_per_min') else '—' }}
                        **m²/% battery**: {{ '%.2f'|format(state_attr('sensor.dreame_a2_mower_picked_session','m2_per_pct')) if state_attr('sensor.dreame_a2_mower_picked_session','m2_per_pct') else '—' }}
                    - type: markdown
                      content: |
                        ### Energy & time breakdown
                        **Battery**: start {{ state_attr('sensor.dreame_a2_mower_picked_session','charge_at_start_pct') }}% / end {{ state_attr('sensor.dreame_a2_mower_picked_session','charge_at_end_pct') }}% (min {{ state_attr('sensor.dreame_a2_mower_picked_session','charge_min_pct') }}%)
                        **Charge consumed**: {{ state_attr('sensor.dreame_a2_mower_picked_session','charge_used_pct') }}% (recovered {{ state_attr('sensor.dreame_a2_mower_picked_session','charge_recovered_pct') }}% across {{ state_attr('sensor.dreame_a2_mower_picked_session','recharge_count') }} recharge(s))
                        **Time mowing**: {{ state_attr('sensor.dreame_a2_mower_picked_session','time_mowing_min') }} min
                        **Time charging**: {{ state_attr('sensor.dreame_a2_mower_picked_session','time_charging_min') }} min
                        **Rain protection delay**: {{ state_attr('sensor.dreame_a2_mower_picked_session','time_rain_protection_min') }} min
                        **Time other**: {{ state_attr('sensor.dreame_a2_mower_picked_session','time_other_min') }} min
                    - type: markdown
                      content: |
                        ### Diagnostics
                        **Faults**: {{ state_attr('sensor.dreame_a2_mower_picked_session','fault_count') }}
                        **Obstacles**: {{ state_attr('sensor.dreame_a2_mower_picked_session','obstacle_count') }} (AI {{ state_attr('sensor.dreame_a2_mower_picked_session','ai_obstacle_count') }})
                        **State transitions**: {{ state_attr('sensor.dreame_a2_mower_picked_session','state_transition_count') }}
                        **Error events**: {{ state_attr('sensor.dreame_a2_mower_picked_session','error_event_count') }} (codes {{ state_attr('sensor.dreame_a2_mower_picked_session','error_codes_seen') }})
                        **WiFi RSSI**: min {{ state_attr('sensor.dreame_a2_mower_picked_session','wifi_rssi_min_dbm') }} / avg {{ state_attr('sensor.dreame_a2_mower_picked_session','wifi_rssi_avg_dbm') }} / max {{ state_attr('sensor.dreame_a2_mower_picked_session','wifi_rssi_max_dbm') }} dBm ({{ state_attr('sensor.dreame_a2_mower_picked_session','wifi_sample_count') }} fingerprints)

                # Settings-snapshot card. `type: conditional` doesn't
                # support `condition: template`, so this is always
                # rendered with Jinja branching on the attribute
                # itself — pre-v1.0.13a1 archives lack the snapshot
                # and show a placeholder line instead.
                - type: markdown
                  content: |
                    ### Settings in effect at session start
                    {% set s = state_attr('sensor.dreame_a2_mower_picked_session','settings_snapshot') %}
                    {% if s %}
                    {% if s.get('version', 0) >= 2 %}
                    {% set pm = s.get('per_map') or {} %}
                    {% set dw = s.get('device_wide') or {} %}
                    {% set pe = s.get('peripheral') or {} %}
                    {% set fo = s.get('forensic') or {} %}
                    **Per-map:** EdgeMaster {{ pm.get('edgemaster') }} · Walk {{ pm.get('edgeMowingWalkMode') }} · Auto {{ pm.get('edgeMowingAuto') }} · Safe {{ pm.get('edgeMowingSafe') }} · OA {{ pm.get('obstacleAvoidanceEnabled') }} (AI: {{ pm.get('obstacleAvoidanceAi') }}) · Height {{ pm.get('mowingHeight') }} cm

                    **Device-wide:** Rain {{ dw.get('rain_protection_enabled') }} (resume {{ dw.get('rain_protection_resume_hours') }}h) · Frost {{ dw.get('frost_protection_enabled') }} · Nav-smart {{ dw.get('navigation_path_smart') }} · DnD {{ dw.get('dnd_enabled') }} · Low-speed-night {{ dw.get('low_speed_at_night_enabled') }} · Auto-recharge {{ dw.get('auto_recharge_battery_pct') }}%

                    **Human Presence:** Alert {{ pe.get('human_presence_alert_enabled') }} · Sensitivity {{ pe.get('human_presence_alert_sensitivity') }} · Push every {{ pe.get('human_presence_alert_push_interval_min') }} min · Photo consent {{ pe.get('photo_consent') }} · AI photos {{ pe.get('ai_obstacle_photos_enabled') }}

                    **Forensic:** LED standby={{ fo.get('led_in_standby') }} working={{ fo.get('led_in_working') }} charging={{ fo.get('led_in_charging') }} error={{ fo.get('led_in_error') }} · Anti-theft lift={{ fo.get('anti_theft_lift_alarm') }} offmap={{ fo.get('anti_theft_offmap_alarm') }} RT={{ fo.get('anti_theft_realtime_location') }} · Child lock {{ fo.get('child_lock_enabled') }}
                    {% else %}
                    **EdgeMaster**: {{ s.get('settings_edgemaster') }}
                    **Edge walk mode**: {{ s.get('settings_edge_mowing_walk_mode') }}
                    **Edge mowing mode**: {{ s.get('settings_edge_mowing_mode') }}
                    **Obstacle avoidance**: {{ s.get('settings_obstacle_avoidance_mode') }} (AI: {{ s.get('settings_obstacle_avoidance_ai') }})
                    **Mowing height**: {{ s.get('settings_mowing_height_mm') }} mm
                    **Mowing efficiency**: {{ s.get('settings_mowing_efficiency') }}
                    {% endif %}
                    {% else %}
                    _Not captured for this session — settings_snapshot was added in v1.0.13a1. Sessions starting from now will populate this._
                    {% endif %}

                # Charts row (Battery + WiFi side-by-side). Uses
                # plotly-graph-card — its $fn JS callbacks read the
                # entity's attributes directly and the datetime x-axis
                # auto-fits to the data's actual time extents, so the
                # x labels show the SESSION's real clock times instead
                # of the "shifted to now" workaround the apex cards
                # had to use. Replaces apexcharts-card here because
                # apex hardcoded xaxis.type:datetime + graph_span time-
                # window filtering, which kept clipping the data.
                - type: horizontal-stack
                  cards:
                    # v3.3.5 quirk: the card always injects
                    # xaxis.range = [now - hours_to_show, now] (see
                    # defaults.ts addPostParsingDefaults), and Plotly
                    # treats an explicit range as authoritative on
                    # first render, so layout.xaxis.autorange: true
                    # cannot defeat it. The supported escape is the
                    # top-level visible_range key, which when supplied
                    # as a $fn replaces that computed window. We
                    # derive [start, end] from the picked-session
                    # sample timestamps so the x-axis fits the data's
                    # real clock span.
                    # refresh_interval: omitted on purpose. The default
                    # "auto" is what wires the card's hass-setter path
                    # (plotly-graph-card.ts:208-247) to re-call plot()
                    # when the picked-session sensor's state changes —
                    # i.e. when the user picks a different session.
                    # refresh_interval: 0 disables that path; the graph
                    # then only updates on manual reload.
                    - type: custom:plotly-graph
                      title: Battery % over session
                      visible_range: |
                        $fn ({ hass }) => {
                          const a = hass.states['sensor.dreame_a2_mower_picked_session']?.attributes?.battery_samples || [];
                          if (!a.length) { const n = Date.now(); return [n - 3600e3, n]; }
                          const t0 = a[0][0] * 1000, t1 = a[a.length - 1][0] * 1000;
                          const pad = Math.max((t1 - t0) * 0.02, 30e3);
                          return [t0 - pad, t1 + pad];
                        }
                      entities:
                        - entity: sensor.dreame_a2_mower_picked_session
                          name: Battery %
                          show_value: false
                          line:
                            color: rgb(255, 140, 0)
                            width: 2
                          # Top-level x:/y: $fn injects trace data directly.
                          # Read via hass.states[...]?.attributes?.X — the
                          # `vars` binding's .attributes is sometimes
                          # undefined during the state-change re-render
                          # transient (sensor between "(pick a session)"
                          # and the new session id), which threw
                          # "cannot read properties of undefined (reading
                          # 'battery_samples')" and killed the trace.
                          #
                          # Gap-aware: between consecutive samples whose
                          # dt > 300 s (5 min), insert a midpoint x with
                          # y=null so plotly breaks the line (default
                          # connectgaps:false on scatter traces). Normal
                          # battery cadence is 30-90 s during charging
                          # or mowing; anything over 5 min is a real
                          # MQTT/cloud outage and the straight-line
                          # interpolation is misleading.
                          x: |
                            $fn ({ hass }) => {
                              const a = hass.states['sensor.dreame_a2_mower_picked_session']?.attributes?.battery_samples || [];
                              const xs = [];
                              for (let i = 0; i < a.length; i++) {
                                xs.push(new Date(a[i][0] * 1000));
                                if (i + 1 < a.length && a[i+1][0] - a[i][0] > 300) {
                                  xs.push(new Date((a[i][0] + a[i+1][0]) * 500));
                                }
                              }
                              return xs;
                            }
                          y: |
                            $fn ({ hass }) => {
                              const a = hass.states['sensor.dreame_a2_mower_picked_session']?.attributes?.battery_samples || [];
                              const ys = [];
                              for (let i = 0; i < a.length; i++) {
                                ys.push(a[i][1]);
                                if (i + 1 < a.length && a[i+1][0] - a[i][0] > 300) {
                                  ys.push(null);
                                }
                              }
                              return ys;
                            }
                      layout:
                        yaxis:
                          title:
                            text: Battery %
                          range: [0, 100]
                        margin:
                          l: 50
                          r: 30
                          t: 20
                          b: 50
                        height: 280
                    - type: custom:plotly-graph
                      title: WiFi RSSI over session
                      visible_range: |
                        $fn ({ hass }) => {
                          const a = hass.states['sensor.dreame_a2_mower_picked_session']?.attributes?.wifi_samples || [];
                          if (!a.length) { const n = Date.now(); return [n - 3600e3, n]; }
                          const t0 = a[0][3] * 1000, t1 = a[a.length - 1][3] * 1000;
                          const pad = Math.max((t1 - t0) * 0.02, 30e3);
                          return [t0 - pad, t1 + pad];
                        }
                      entities:
                        - entity: sensor.dreame_a2_mower_picked_session
                          name: RSSI (dBm)
                          show_value: false
                          line:
                            color: rgb(255, 140, 0)
                            width: 2
                          # Same gap-aware pattern as the battery
                          # trace. wifi_samples timestamp is index 3,
                          # rssi is index 2.
                          x: |
                            $fn ({ hass }) => {
                              const a = hass.states['sensor.dreame_a2_mower_picked_session']?.attributes?.wifi_samples || [];
                              const xs = [];
                              for (let i = 0; i < a.length; i++) {
                                xs.push(new Date(a[i][3] * 1000));
                                if (i + 1 < a.length && a[i+1][3] - a[i][3] > 300) {
                                  xs.push(new Date((a[i][3] + a[i+1][3]) * 500));
                                }
                              }
                              return xs;
                            }
                          y: |
                            $fn ({ hass }) => {
                              const a = hass.states['sensor.dreame_a2_mower_picked_session']?.attributes?.wifi_samples || [];
                              const ys = [];
                              for (let i = 0; i < a.length; i++) {
                                ys.push(a[i][2]);
                                if (i + 1 < a.length && a[i+1][3] - a[i][3] > 300) {
                                  ys.push(null);
                                }
                              }
                              return ys;
                            }
                      layout:
                        yaxis:
                          title:
                            text: RSSI (dBm)
                        margin:
                          l: 50
                          r: 30
                          t: 20
                          b: 50
                        height: 280

          - *tab_header_lidar

          # 1fr 2fr 1fr row: archive (25%) | lidar card (50%) | re-tag (25%).
          # `type: grid` doesn't support per-child cell-spanning that survives
          # HA's hui-card wrapper, so we use a horizontal-stack and override
          # its #root flex layout to a CSS grid with explicit column widths.
          - type: horizontal-stack
            card_mod:
              style: |
                #root {
                  display: grid !important;
                  grid-template-columns: 1fr 2fr 1fr !important;
                  gap: 8px !important;
                }
            cards:
              - type: entities
                title: Archive
                entities:
                  - entity: sensor.dreame_a2_mower_lidar_archive_count
                    name: Total scans
                  - entity: select.dreame_a2_mower_lidar_archive
                    name: Selected scan

              - type: custom:dreame-a2-lidar-card
                url: /api/dreame_a2_mower/lidar/selected.pcd
                picker_entity: select.dreame_a2_mower_lidar_archive

              - type: markdown
                content: |
                  ### Re-tag a mis-categorized scan
                  Use **Developer Tools → Services** with
                  `dreame_a2_mower.move_lidar_scan` — provide `from_map_id`,
                  `filename` (from picker option text), `to_map_id`.

          - *tab_header_wifi

          # 1fr 2fr 1fr row: viewer controls (25%) | heatmap (50%) | refresh (25%).
          # See LiDAR tab for why horizontal-stack + #root grid-template-columns
          # is used instead of `type: grid` with span — HA's hui-card wrapper
          # blocks the :host { grid-column: span 2 } trick.
          - type: horizontal-stack
            card_mod:
              style: |
                #root {
                  display: grid !important;
                  grid-template-columns: 1fr 2fr 1fr !important;
                  gap: 8px !important;
                }
            cards:
              - type: entities
                title: Viewer controls
                show_header_toggle: false
                entities:
                  - entity: select.dreame_a2_mower_wifi_archive
                    name: Heatmap
                  - entity: input_boolean.dreame_a2_mower_wifi_flip_x
                    name: Flip X (override)
                    icon: mdi:flip-horizontal
                  - entity: input_boolean.dreame_a2_mower_wifi_flip_y
                    name: Flip Y (override)
                    icon: mdi:flip-vertical
                  - entity: sensor.dreame_a2_mower_wifi_map_last_refresh
                    name: Last refresh

              # Heatmap alone via picture-entity. Base-map overlay was attempted
              # via picture-elements with image_entity — broken across HA's
              # streaming-vs-static camera proxy paths for our custom static
              # cameras. Deferred until heatmap → map_id correlation is solved
              # (see docs/research/wifi-heatmap-todo.md Issue #4).
              - type: picture-entity
                entity: camera.dreame_a2_mower_wifi_heatmap_selected
                name: WiFi heatmap
                camera_view: auto
                show_state: false
                tap_action:
                  action: none
                hold_action:
                  action: none

              - type: entities
                entities:
                  - entity: button.dreame_a2_mower_refresh_wifi_heatmaps
                    name: Refresh WiFi heatmaps (all maps)


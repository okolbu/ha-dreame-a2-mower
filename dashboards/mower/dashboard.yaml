                  - type: markdown
                    content: |
                      _**Alert enabled** and **Sensitivity** are writable (top two rows). The scenario flags, voice/push alert, and push interval below are read-only status from the device — those REC sub-fields have no confirmed write path on this firmware._

              # ───── Child Lock ─────

      sweep. All are N/A for the mower integration. [app-mitm:2026-06-09-settings-sweep]

      DEVICE RENAME (account-level, not a mower CFG):
        POST :13267/dreame-user-iot/iotuserbind/device/rename
          {deviceCustomName, did, sign, timestamp}
        → sets account-visible customName (same as listV2 customName).
        Not a device setting; the integration has no rename action.
        [app-mitm:2026-06-09-settings-sweep]

      REGION (read-only, account-bound):
        POST api.link.aliyun.com/living/account/region/get → {region:"eu"} (read only).
        No region SET/update endpoint exists. Region is fixed at account registration;
        "changing region" requires re-login to a different regional server via the app.
        The integration follows the account's region/get result — it cannot write or
        switch region. [app-mitm:2026-06-09-settings-sweep]

      COUNTRY → REGION MAPPING (app cosmetic; same region for EU countries):
        POST /dreame-user/v1/set-country {countryCode:"SE"|"NO"|…}
        → triggers country-keyed re-init (queryUrlByCountryBatch, privacy/by-country,
          mall tab, device re-list) but does NOT change the Alibaba region.
        Country→region map from server config: dreame-system/dreame-app/setting/query
          item euPrivacyCountries = EU-country list → region:"eu-central-1".
        Confirmed: Norway→Sweden both → region:"eu" unchanged.
        [app-mitm:2026-06-09-settings-sweep]
        N/A for integration: country selection is a cosmetic/app preference; the
        integration is region-agnostic (uses the authenticated region from region/get).

      SMARTHOME HOME/ROOM (vacuum lineage, N/A for mower):
        POST /dreame-user-iot/smarthome/home/addOrUpdate {homeId, homeName}
        POST /dreame-user-iot/smarthome/room/addOrUpdate {homeId, rooms:[{roomName, roomTemplateId}]}
        GET dreame-user-iot/smarthome/home, home/checkRoomUpdate, scene-log/getLog
        These are vacuum/smarthome family features (room templates Kitchen=5, etc.).
        The mower does not use rooms; all smarthome endpoints are N/A.
        [app-mitm:2026-06-09-settings-sweep]

      ROBOT SHARING (deferred — needs target account):
        GET /dreame-user/v1/query?<email/phone> → account check
        GET /dreame-user/v1/contacts → saved share contacts
        POST /dreame-user-iot/iotuserbind/device/sharedUserList → existing shares
        Actual share/invite POST deferred (needs valid target account, not tested).
        [app-mitm:2026-06-09-settings-sweep]

      DEVICE UNBIND (DO NOT TEST — destructive):
        Likely iotuserbind/device/unbind style. Unbinds the device; risks losing
        cloud-stored maps/sessions. Capture only with a throwaway binding.
        [app-mitm:2026-06-09-settings-sweep]

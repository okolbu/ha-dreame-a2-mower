      g2408-session-archive-quirks).
    status:
      seen_on_wire: true
      first_seen: "2026-04-29"
      last_seen: "2026-06-09"
      decoded: confirmed
    verifications:
      - date: "2026-05-31"
        status: verified
        claim: |
          Re-confirmed live + documented the WAKE-UP RETRY behaviour of the action
          transport. routed_action(103, {area:[1]}) from a standalone probe (no
          persistent device connection) returned 80001 on attempts 1-2 then r:0 on
          attempt 3 ~16s later — {"aiid":50,"code":0,"out":[{"m":"r","q":63,"r":0}],
          "siid":2} — and the mower physically left the dock to mow spot 1
          (user-confirmed). 80001 ("device offline / send timeout") on an idle-docked
          g2408 is the /device/sendCommand relay timing out reaching the ASLEEP device;
          an early call wakes it, a retry lands. send()/routed_action do NOT retry
          80001 (fast-return None), so a single dispatch can silently no-op on a cold
          device — external probes/tests must RETRY (~3-5× over 15-25s). The lever is
          RETRY, not MQTT: both successful live runs held ZERO MQTT connection from our
          side, so a passive broker subscription does NOT wake the device or keep the
          relay warm. What makes a command land first-try is the device being RECENTLY
          ACTIVE — proven 2026-05-31: cold dock → op=103 80001×2 then r:0 on attempt 3;
          immediately after that mow (warm) → op=9 AND op=109 both r:0 on attempt 1, no
          80001. (Why the HA integration rarely sees 80001 is NOT pinned — likely its
          constant cloud polling keeps the device engaged; the earlier "MQTT presence
          keeps it warm" was speculation and is withdrawn.) MQTT listening is useful
          only for CONFIRMATION (cloud r:0 proves cloud-accept, not firmware-accept —
          watch s2p50/s2p56 to verify the device acted). Generalises to ALL routed
          actions (op=100-103, etc.).
        evidence: "live probe_cruise_to_point.py --spot-control 1 --retries 5 then --routed-byid --retries 5 2026-05-31 (did -112293549); user confirmed 'now mowing spot 1'; warm follow-up op=9 + op=109 r:0 on attempt 1"

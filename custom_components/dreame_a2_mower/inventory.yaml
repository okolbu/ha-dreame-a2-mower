  - id: "s99p20"
    siid: 99
    piid: 20
    name: "lidar_object_name"
    category: "blob"
    value_kind: blob
    payload_shape: "string (OSS object key)"
    semantic: |
      LiDAR point-cloud OSS object key. Published by the mower each time the user
      taps "View LiDAR Map" in the Dreame app and the current scan differs from
      the last-uploaded one. Arrives BEFORE s2p54 = 100 (at 61% progress in the
      observed capture).

      Key format: ali_dreame/YYYY/MM/DD/<master-uid>/<did>_HHMMSSmmm.MMMM.bin
      Example: "ali_dreame/2026/04/20/BM16nnnn/-11229nnnn_154157120.0550.bin"

      The integration's _handle_lidar_object_name fetches the binary blob via
      cloud.get_interim_file_url (getDownloadUrl endpoint) → OSS signed URL →
      HTTP GET → writes to LidarArchive under
      <config>/dreame_a2_mower/lidar/YYYY-MM-DD_<ts>_<md5>.pcd.
      Content-addressed by md5; re-tapping the same scan is a no-op.

      PULL-BASED ALTERNATIVE (2026-05-31): these exact objects are also listed by
      the OBJ routed action `s2.50 m='g' t='OBJ' d={type:'3dmap'}` → {out:[{d:
      {name:[<obj>,...]}}]}, newest-first. Confirmed identical: s99.20 announced
      04-19/04-20/05-10; the 3dmap list returned 04-20+05-10 (newest ~2; 04-19
      had aged out); fetching the 05-10 object yields a `# .PCD v0.7` point cloud
      (831 KB). So `3dmap` == the s99.20 LiDAR PCDs. The s99.20 MQTT push is the
      primary (free, rides the stream we already consume); the 3dmap OBJ list is
      a backfill option — limited retention (newest ~2) and via the 80001-flaky
      relay, so NOT a full archive. WIRED 2026-05-31: cloud_client.list_3dmap_objects()
      + coordinator._backfill_lidar_from_3dmap() run once per session from
      _refresh_cloud_state (after _apply_mapl), fetching any 3dmap object not already
      archived (dedup by object_name → no re-download) into the active map's
      LidarArchive. Relay 80001 leaves it unretried-this-cycle and the next refresh
      tries again; the live s99.20 push remains the primary source for new scans.
    status:
      seen_on_wire: true
      first_seen: "2026-04-17"
      last_seen: "2026-06-04"
      decoded: confirmed
    verifications:
      - date: "2026-05-31"
        status: verified
        claim: |
          The OBJ routed action type 'wifimap' and '3dmap' are the only real OBJ
          types on g2408; '3dmap' returns the SAME .0550.bin objects that s99.20
          announces (LiDAR PCDs, `# .PCD v0.7`). 3dmap is a pull-based alternative
          to the s99.20 push, with limited retention (newest ~2).
        evidence: "live s2.50 OBJ t=3dmap 2026-05-31 returned 04-20+05-10 objects matching s99.20 pushes in probe_log_*; fetched 05-10 .0550.bin = PCD v0.7 831KB"
      - date: "2026-06-03"
        status: partial
        claim: |
          No integration-triggerable "fresh WiFi scan" command exists on g2408 —
          there is nothing to trigger. The wifimap OBJ objects are autonomously
          generated by the firmware at firmware-internal trigger times; the mower
          accumulates a heatmap from its ongoing RSSI stream (s1p1 heartbeat
          byte[17] / s6p3, ~20s cadence) and uploads a new wifimap object on its
          own schedule [UNVERIFIED — exact generation trigger never wire-captured].
          The ONLY fetch surface is the OBJ pull (s2.50 m='g' t='OBJ'
          d={type:'wifimap'}), which returns whatever already exists; the upstream
          s6.aiid=4 "request fresh" RPC returns 80001 (siid-6 tunnel closed on this
          fw). So the integration's role is COMPLETE: boot seed + 6h re-list of
          refresh_wifi_archive() pull every cloud wifimap object, archive/dedup it,
          per-map fingerprint-tag, render (camera + per-map cameras + picker), and a
          manual "Refresh WiFi heatmaps" button (DreameA2RefreshAllWifiButton) does
          the same on demand. Closes the TODO "Trigger a fresh WiFi heatmap render"
          (moved to DONE.md 2026-06-03). Gap = the exact autonomous-upload trigger.
        evidence: "s6.aiid=4 → 80001 verified 2026-05-09; OBJ t=wifimap returns only already-cached objects (live test 2026-05-31, same run as the 3dmap/photo OBJ sweep); integration paths coordinator/_core.py refresh_wifi_archive boot seed + 6h _periodic_archive_refresh, button.py DreameA2RefreshAllWifiButton"
      - date: "2026-06-04"
        status: verified
        claim: |
          s99p20 is NOT a firmware / OTA package path — it is the LiDAR
          map-binary (PCD) object key. The three s99p20 values ever seen on the
          wire (2026-04-19 / 04-20 / 05-10) were re-downloaded today via
          iotfile/getDownloadUrl and are each `# .PCD v0.7` point clouds
          (145257 / 153261 / 51932 points). The signed OSS URL path is
          `iot/mapbin/000000/...` ("map binary"), confirming map data, not
          firmware.

          The ".0550" filename suffix is the device's RUNNING-firmware stamp
          (CFG.DEV.fw = 4.3.6_0550) applied to every device-uploaded OSS object —
          it also appears on the session-summary `.0550.json` files (cloud/oss/)
          and patrol `.0550.json`. It is NOT an OTA-package version; all three
          PCDs carry the same 0550 stamp because the mower ran fw 0550 the whole
          time. The variable number in the filename decodes as the UTC
          time-of-day of staging (HHMMSSmmm) and matches each properties_changed
          event timestamp to the second; masterUid "BM169439" is the uid segment.

          This DEBUNKS the upstream dreame-mower guess that
          DEVICE_FILE_PATH_PROPERTY_20 (siid=99 piid=20) carries "Firmware/OTA
          update packages (when firmware updates are available)" — that comment
          is wrong for g2408. The real OTA wire signals are s1p2
          (firmware/ota state) + s1p3 (progress), neither yet wire-captured.
        evidence: "fw_download/path{1,2,3}_*.0550.pcd downloaded 2026-06-04 via iotfile/getDownloadUrl — all PCD v0.7, OSS bucket path iot/mapbin/000000/; s2p54 100→86→100 brackets the 05-10 push in probe_log_20260419_130434.jsonl@2026-05-10 19:03:50 (View-LiDAR upload dip); upstream mislabel at OLD/alternatives_archive_2026-05-05/alternatives/dreame-mower/custom_components/dreame_mower/dreame/const.py:94"
      - date: "2026-06-08"
        status: verified
        claim: "Live-map WiFi overlay anchors cells to the cloud frame by inverting the cell-index formula used by wifi_match.score_candidates (same arithmetic; the card does NOT call that module): cell (cx,cy) -> cloud-metre box [start_x_m+cx*res .. start_x_m+(cx+1)*res] x [start_y_m+cy*res .. start_y_m+(cy+1)*res], then projecting both corners with the card's projectPoint (which already bakes the FLIP_TOP_BOTTOM convention, so no extra flip). Forward projection visually confirmed on the live map: cell alignment correct, no axis flip needed."
        evidence: "live-dashboard visual confirmation 2026-06-08 (v1.0.24a1): user toggled the WiFi overlay on and reported colors, cell alignment, and opacity all correct"
      - date: "2026-06-09"
        status: verified
        claim: |
          OBJ-list parity confirmed: list_3dmap_objects() returns BOTH archived
          PCDs reachable — ali_dreame/2026/04/20/BM169439/-112293549_154157120.0550.bin
          (153261 pts, 2.45 MB) AND ali_dreame/2026/05/10/BM169439/-112293549_170348301.0550.bin
          (51932 pts, 831 KB). The denser 04/20 scan IS reachable via our OBJ-list
          (counters the op10_3dmap_negative concern that the dense LiDAR surface was
          unreachable via archived PCDs). Density ≠ recency: the integration's default
          LiDAR camera renders latest()-by-timestamp (sparse 05/10), while the app
          showed the denser older 04/20. This is a render-default/selection UX matter,
          not a fetch gap.
        evidence: "tools/probes/lidar_parity_probe.py live run 2026-06-09"
    open_questions:

  - id: "s2p56"
    siid: 2
    piid: 56
    name: "task_state"
    category: "property"
    value_kind: nested
    observed_shapes:
      - {sig: 'status', status: unknown}
    payload_shape: "{status: list of [task_type, ...] tuples}"
    semantic: |
      Cloud status push — internal task-state ack. Wire envelope has two
      observed shapes on g2408:

        2-element variant — full-area mows (most common, 163/213 in corpus):
          {"status": []}            no active task
          {"status": [[1, 0]]}      running
          {"status": [[1, 2]]}      complete / transitional
          {"status": [[1, 4]]}      paused-pending-resume / recharge boundary

        3-element variant — SCHEDULED mows (since 2026-04-27); a value is inserted
        in the MIDDLE so the stage moves to the LAST element. Structure is
        [task_id, X, stage] where X is always 0 (undecoded — likely a segment/lap
        index) and the STAGE is the LAST element (decoded 2026-05-30):
          {"status": [[1, 0, 0]]}   running — last value 0
          {"status": [[1, 0, 4]]}   PAUSED  — last value 4 (e.g. stuck/rain mid-run)
          {"status": [[1, 0, 2]]}   DONE    — last value 2
        [1,0,2] = SESSION-DONE (NOT a "segment" that resumes). Corpus-verified
        2026-05-30: across all 10 [1,0,2] events the mower DOCKS within ~1 min
        (s2p1→6) and NONE is preceded by a rain code (s2p2=56). The few later
        re-activations are SEPARATE mows 15-25 min after docking, not resumes.
        DEBUNKED: the 2026-05-16 claim that "[1,0,2] at 19:13 then ran 19 h
        rain-spanned (2026-05-09 edge mow)" is FALSE — that mow docked at 19:14.
        Treat that whole "segment vs archive session / rain-spans-[1,0,2]" story
        (incl. an earlier version of THIS note) as guesswork that was wrong.
        Consequence: the integration now reads status[0][-1] (the LAST element) as
        task_state_code — correct for both 2- and 3-element, and it surfaces the
        3-element PAUSE [1,0,4] which the old middle-read missed. (v1.0.x 2026-05-30;
        property_mapping.py (2,56).)
        NB the earlier "3-element = edge/spot/zone mows" attribution is imprecise:
        3-element correlates with SCHEDULED runs (morning all-area mode=100 included),
        not mow type. App-triggered runs (points, manual, the 2-spot mow) stay 2-element.
        [CORRECTED 2026-06-07 — see verifications: the split tracks MOW TYPE = EDGE.
        3-element ⟺ EDGE mow; 2-element ⟺ all-area / zone / spot / manual. Confirmed by
        14/14 days of 07:58 all-area = 2-element, scheduled zone = 2-element, and all 10
        three-element days being short evening edge sessions. NOT scheduled-correlated.]

      The integration extracts status[0][-1] (the LAST element = stage) as
      task_state_code: 0=running, 4=paused, 2=complete, None=no task. This is
      correct for both 2-element (last == [1]) and 3-element (last is the stage,
      not the constant-0 middle). Pre-2026-05-30 it read status[0][1], which on
      3-element runs returned the middle 0 and hid done/paused — a workaround
      built on the now-debunked 19h-rain story (see above). The session-end
      signal can be either the [1,0,2]/empty `[]` event OR the integration's
      cloud-summary gate. The probe sometimes misses the `[]` event (HA restart,
      probe truncation) in which case the HA
      archive's recorded `start` / `end` fields are the ground truth.

      The session-state machine uses task_state_code for begin_session /
      begin_leg / session-end transitions: 0→4→0 is a recharge round-trip;
      4→0 triggers begin_leg; prev∈{0,4} and new∈{2,None} means session ended.

      Confirmed g2408 sub-state values from 2026-04-29/30 corpus. Note: wire shape
      is a dict, not a bare int — a common decode trap for apk-decompiled code.
    status:
      seen_on_wire: true
      first_seen: "2026-04-17"
      last_seen: "2026-05-16"
      decoded: confirmed
    verifications:
      - date: "2026-05-30"
        status: verified
        claim: |
          status is a LIST with ONE ENTRY PER QUEUED TARGET, not a single task.
          Live 2-spot mow (app-triggered, 2 of 3 spots): 21:18:32 status=[[1,0],[2,-1]]
          (spot id 1 running stage 0, spot id 2 queued stage -1) → 21:25:43
          [[1,2],[2,0]] (spot 1 done stage 2, spot 2 now running) → 21:30:40
          [[1,2],[2,2]] (both done) → one s2p2=48 for the whole command. So:
          (a) the first element of each entry = a STABLE per-target id (the selector
          — which point/spot/zone/edge; confirmed for points 2026-05-30: ids
          2,1,1,2 across the four point runs); (b) stage adds value -1 = QUEUED
          (new), alongside 0=running/2=done; (c) the list advances in-place (entries
          persist, stages tick), so target_ids = [e[0] for e in status] and
          per-target progress are readable from any push; (d) per-target completion
          in a multi-target run is the stage→2, NOT an s2p2 code (no s2p2 fired
          between the two spots). One app command can queue multiple items run in
          order.
        evidence: "probe_log_20260520_131350.jsonl @ 2026-05-30 21:18:32→21:30:40 (2-spot mow); point-run task_ids 2,1,1,2 @ 15:18/16:50/16:59/17:26"
      - date: "2026-06-03"
        status: verified
        claim: |
          The same per-target queue vocab applies to op=107 POINT PATROL. A live
          double-point patrol stepped []→[[3,0],[4,-1]]→[[3,2],[4,-1]]→[[3,2],[4,0]]
          →[[3,2],[4,2]] then s2p2=74: point ids 3 & 4, stage -1=queued → 0=running
          → 2=done, advancing in-place exactly like the 2-spot mow. Confirms the
          [point_id, stage] shape and the -1/0/2 vocab are shared across point
          patrol and multi-spot mow. NOTE: the per-point app settings (cycles 2/1,
          auto-capture on/off) are NOT in s2p56 — only id + stage.
        evidence: "probe_log_20260520_131350.jsonl @ 2026-06-03 20:43:27→20:46:02 (op=107 2-point patrol)"
      - date: "2026-05-16"
        status: verified
        claim: |
          3-element variant {"status": [[1, 0, 2]]} is NOT a session-end signal
          on its own. Documented at first sighting as "complete" but the
          2026-05-09 19:00 scheduled edge mow emitted [1,0,2] at 19:13 and then
          continued mowing for ~19 more hours (two 4-hour rain-protection
          delays). The true session-end is signalled later by an empty status
          `[]` event or by the integration's cloud-summary gate.
        evidence: "/data/claude/homeassistant/probe/logs/probe_log_20260514_211550.jsonl@2026-05-09 19:00:46→2026-05-10 14:11:55 + user confirmation"
      - date: "2026-05-16"
        status: retracted
        claim: |
          tried treating status[0][-1] as the unified sub_state extractor in
          tools/session/rebuild_session.py
        retracts: "sub_state is the LAST element, status[0][-1] cross-format"
        reason: |
          Hypothesis fit the 13-min 2026-05-16 19:00 case but broke the 19-hour
          2026-05-09 19:00 case (rain-paused edge mow). Reverted. The rebuild
          tool now falls back to the HA archive's start/end fields when no
          probe-detected window matches the requested --session-start.
      - date: "2026-06-07"
        status: partial
        claim: |
          RESOLVED (full-corpus): the 2-vs-3-element split tracks MOW TYPE = EDGE.
          3-element ⟺ EDGE mow; 2-element ⟺ everything else (all-area, zone, spot,
          manual points). Discriminating evidence:
            * all-area: the recurring 07:58 scheduled all-area mow is 2-element on
              14/14 days (s2p2=53, plus the 28/30 maintenance-variant starts).
            * zone: scheduled zone 2026-06-07 21:30 = 2-element (2/2 pushes).
            * spot: the 2026-05-30 2-spot mow = 2-element (see the 2026-05-30 verification).
            * edge: scheduled edge 2026-06-06 19:00 = 3-element (2/2), and ALL 10
              three-element days in the corpus are short evening sessions (~13-30 min,
              ~19:00-21:30) matching the user's evening edge schedule (incl. the
              inventory-referenced 2026-05-09 / 2026-05-16 edge mows). The two
              apparent "morning 3-element" days were SEPARATE non-07:58 runs (e.g.
              2026-05-05 08:50 was s2p2=50 MANUAL, not the 07:58 all-area).
          This is the PRECISE form of the original (over-broadly debunked) edge
          attribution: EDGE only, not "edge/spot/zone". Remaining gap → status partial:
          the non-2026-06-06 evening 3-element days are inferred-edge by timing/duration,
          not each independently mow-type-confirmed.
        evidence: "full corpus probe/logs/probe_log_*.jsonl: 14 days of 07:58 all-area (s2p2=53) all 2-element; zone 2026-06-07 21:30 2-element; edge 2026-06-06 19:00 3-element; all 34 three-element pushes on 10 short-evening-session days"
        retracts: "3-element correlates with SCHEDULED runs (morning all-area mode=100 included), not mow type"
        reason: "the recurring 07:58 all-area SCHEDULED mow is 2-element on 14/14 days and the scheduled zone is 2-element, while the scheduled edge is 3-element — so the element count tracks mow TYPE (edge), not scheduled-vs-manual. The earlier 'morning all-area was 3-element' data point was a misclassified separate session (a manual 08:50 run, s2p2=50)."
      - date: "2026-06-07"
        status: presumed
        claim: |
          The 3-element MIDDLE value (X in [task_id, X, stage], always 0 in the
          corpus) is the EDGE INDEX within the zone — which edge to mow. This is
          why ONLY edge mows are 3-element: edge carries an edge selector, all-area
          and zone do not. Grounded in the app's schedule entry naming (user, prior

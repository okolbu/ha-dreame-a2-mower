  - id: "s2p51_rain_protection"
    setting_name: "rain_protection"
    cfg_key: "WRP"
    category: "multiplexed"
    payload_shape: "{value: [enabled, resume_hours]}"
    semantic: |
      Rain Protection. Two-element list:
        [0] enabled — rain protection on/off.
        [1] resume_hours — hours after rain stops before resuming mowing.
                           0 = "Don't Mow After Rain" (no auto-resume),
                           1..24 = resume N hours after rain ends.
      Shape is unambiguous by list length (2-element). Confirmed 2026-04-24
      via live toggle with CFG.WRP diff. Shape matches the WRP CFG key exactly.

      WRP[1] is also the wait-window the app uses to derive "rain protection
      active" state after an s2p2=56 transition: the app marks the mower as
      "ACTIVE in rain protection" until (rain_detected_ts + resume_hours * 3600)
      has passed, OR until the user taps Continue. The integration must
      mirror this derivation (see s2p2 verifications 2026-05-15).
    status:
      seen_on_wire: true
      first_seen: "2026-04-24"
      last_seen: "2026-05-15"
      decoded: confirmed
    references:
      integration_code: "custom_components/dreame_a2_mower/protocol/config_s2p51.py"
      protocol_doc: "docs/research/inventory/generated/g2408-canonical.md § s2p51 multiplexed-config shapes"
    verifications:
      - date: "2026-05-15"
        status: verified
        claim: "WRP[1] resume_hours doubles as the wait-window the app applies after s2p2=56 — not just an 'after rain stops' setting. The integration owns this derivation since the device doesn't broadcast the active state continuously."
        evidence: "user observation 2026-05-15: app's rain-protection-active timer matches WRP[1] hours configured in settings"


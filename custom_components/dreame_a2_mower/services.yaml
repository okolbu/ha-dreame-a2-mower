# custom_components/dreame_a2_mower/services.yaml

set_active_selection:
  description: >
    Set the ordered list of zones or spots to be mowed by the next "Start"
    action when action_mode is zone or spot. Updates the integration's
    persistent selection state.
  fields:
    zones:
      description: Zone IDs in mowing order. Empty list to clear zone selection.
      example: "[3, 1, 2]"
      selector:
        object:
    spots:
      description: Spot IDs in mowing order. Empty list to clear spot selection.
      example: "[1]"
      selector:
        object:

mow_zone:
  description: >
    One-shot — set zone selection then start mowing. Equivalent to
    set_active_selection with zones=… followed by lawn_mower.start_mowing
    when action_mode=zone.
  fields:
    zone_ids:
      description: Zone IDs in mowing order.
      required: true
      example: "[3, 1, 2]"
      selector:
        object:

mow_edge:
  description: >
    Edge-mow specific contours. Each contour_id is a [map_id, contour_id]
    pair as returned by the cloud map. Pass an empty list (or omit
    contour_ids) to edge every contour in the current map.
  fields:
    contour_ids:
      description: List of [map_id, contour_id] pairs, e.g. [[1, 0], [1, 1]].
      example: "[[1, 0]]"
      selector:
        object:

mow_spot:
  description: >
    Mow one or more named spot zones (defined in the Dreame app and
    served by the cloud map). Spot IDs are visible as the suffix on
    select.spot's options.
  fields:
    spot_ids:
      description: Spot zone IDs to mow.
      required: true
      example: "[1, 2]"
      selector:
        object:

recharge:
  description: Send the mower to the charging dock immediately.

find_bot:
  description: Make the mower beep so you can locate it.

set_child_lock:
  description: Toggle the child lock (CFG.CLS).

suppress_fault:
  description: Clear a recoverable error condition.

finalize_session:
  description: >
    Manually finalize the in-progress session. Use when the cloud-side
    session-summary fetch fails permanently and the in-progress entry
    is stuck. F5 wires the auto-finalize gate; this is the user-facing
    escape hatch.

replay_session:
  description: >
    Render an archived session's path into the work-log camera for
    playback. The camera entity shows the replay until the user selects
    the work-log picker's placeholder entry (which clears the replay),
    or the config entry is reloaded. No periodic refresh clears it
    automatically.
  fields:
    session_md5:
      description: MD5 of the session to replay (matches sensor.archived_session_count's attributes).
      required: true
      example: "abcd1234..."
      selector:
        text:

show_lidar_fullscreen:
  name: Show LiDAR fullscreen
  description: >
    Fires a `dreame_a2_mower_lidar_fullscreen` event on the HA bus.
    Lovelace cards configured to listen for this event can pop up the
    full-resolution LiDAR view. No parameters today; the convention
    exists for future extensibility.
  fields: {}

dump_map_diagnostics:
  name: Dump map diagnostics
  description: >
    One-off diagnostic service for nav_paths investigation. Fetches raw
    cloud batch data and logs per-map top-level keys, non-empty slot
    counts, and probes alternative batch prefixes (M_PATH, PATH, NAV,
    LINK, MPATH). Results appear in the HA log at WARNING level with the
    prefix "dump_map_diagnostics:". No parameters required.
  fields: {}

discover_cloud_api:
  name: Discover cloud API
  description: >
    Recursive cloud-API discovery service. Fetches the full batch via an
    empty-list get_batch_device_datas call (which returns every key the
    cloud has for this device), groups keys by prefix family, reassembles
    chunked families (PREFIX.0..N + PREFIX.info), JSON-decodes them, and
    walks the structure recording type / key-list / sample values at each
    path. Also probes every cfg_individual endpoint in the integration's
    catalog (CFG, DEV, NET, MAPL, MISTA, etc.). Writes a structured
    report to <config>/dreame_a2_mower/api_discovery.json. No parameters
    required; results available via SCP within ~10 seconds.
  fields: {}

set_schedule_plans:
  name: Set schedule plans
  description: >
    Replace one slot's full plan list (Spring & Summer or Autumn & Winter)
    with a new set of mowing plans. The cloud's atomic unit is the slot
    blob, so this service replaces the entire slot rather than mutating
    individual plans. Used by the bundled Schedule custom card.
  fields:
    slot_id:
      name: Slot ID
      description: 0 = Spring & Summer, 1 = Autumn & Winter
      required: true
      example: 0
      selector: { number: { min: 0, max: 1, step: 1 } }
    plans:
      name: Plans
      description: >
        List of plans. Each plan is a dict with keys: time_min (int 0-1439),
        weekday_mask (int 1-127, bit 0 = Mon), action_type (0=All-area,
        1=Zone, 2=Edge), zone_id (int, required for Zone/Edge),
        extra_bytes_hex (str, hex-encoded, optional — only Edge has this
        for round-trip fidelity).
      required: true

refresh_cloud_state:
  name: Refresh cloud state
  description: >
    Force an on-demand pull of all cloud-derived state (CFG, SETTINGS,
    SCHEDULE, MAP, MIHIS, etc.). Same code path as the periodic 2-min
    poll and the s6p2 MQTT tripwire, but fires immediately. Use it
    when you've just changed a setting in the Dreame app and want HA
    to catch up without waiting, or as a manual smoke-test to confirm
    "everything is current right now". No parameters required.
  fields: {}

move_lidar_scan:
  name: Move LiDAR scan between maps
  description: >
    Move an archived LiDAR scan from one map's archive directory to
    another's. Updates both index.json files. Useful for re-tagging
    scans that landed in the wrong map's archive after the T12
    flat-to-per-map migration.
  fields:
    from_map_id:
      name: From map_id
      description: Source map_id (0 = Map 1, 1 = Map 2)
      required: true
      example: 0
      selector:
        number:
          min: 0
          max: 10
          step: 1
    filename:
      name: Filename
      description: PCD filename to move (must exist in from_map's archive)
      required: true
      example: "2026-04-19_1776600634_98251e68.pcd"
      selector:
        text:
    to_map_id:
      name: To map_id
      description: Destination map_id
      required: true
      example: 1
      selector:
        number:
          min: 0
          max: 10
          step: 1

show_photo_privacy_policy:
  name: Show AI photo capture privacy policy
  description: >
    Create an HA persistent_notification containing the verbatim Dreame
    "AI Obstacle Recognition Privacy Policy" — the policy text the
    Dreame app gates behind its "Privacy Policy for Capturing and
    Transmitting Photos" sub-menu. Use this to review the policy from
    inside HA before accepting it in the Dreame app. The integration
    cannot accept the policy on your behalf (REC writes return r=-3
    on this firmware, and a privacy policy that flips without an
    explicit accept-screen would be a UX bug). The acceptance state
    itself is surfaced read-only at
    binary_sensor.dreame_a2_mower_photo_consent.
  fields: {}

start_point_patrol:
  name: Start point patrol
  description: >
    Launch a point patrol (op=107) over the selected cruise points on a map.
    Cruise points are placed in the Dreame app; ids come from
    sensor.dreame_a2_mower_map_N_patrol_points (attribute items).
    SEND shape is provisional until live-confirmed.
  fields:
    map_id:
      description: Map id. Defaults to the active map if omitted.
      required: false
      example: 0
      selector:
        number:
          min: 0
          max: 10
          step: 1
          mode: box
    point_ids:
      description: Cruise point ids to patrol.
      required: true
      example: "[3, 4]"
      selector:
        object:

start_edge_patrol:
  name: Start edge patrol
  description: >
    Launch an edge patrol (op=108) over the selected outer-perimeter contours.
    Contour pairs come from sensor.dreame_a2_mower_map_N_patrol_edges (items).
    SEND shape is provisional until live-confirmed.
  fields:
    map_id:
      description: Map id. Defaults to the active map if omitted.
      required: false
      example: 0
      selector:
        number:
          min: 0
          max: 10
          step: 1
          mode: box
    contour_ids:
      description: Contour pairs [[m, c], ...] to patrol.
      required: true
      example: "[[1, 0]]"
      selector:
        object:

rename_zone:
  name: Rename mowing zone
  description: >
    Rename a mowing zone on a map (o=219). Editing a non-active map makes it
    the active map. Zone numbers come from the map sensor's renamable_zones
    attribute.
  fields:
    map_id:
      name: Map ID
      description: 0-based map index.
      required: true
      example: 0
      selector:
        number:
          min: 0
          max: 10
          mode: box
    zone:
      name: Zone number
      description: The zone/region number to rename (see the map sensor's renamable_zones).
      required: true
      example: 1
      selector:
        number:
          min: 1
          max: 62
          mode: box
    name:
      name: New name
      description: The new zone name.
      required: true
      example: Front lawn
      selector:
        text:

delete_map_object:
  name: Delete map object
  description: >
    Delete a mowing zone, no-go area, or ignore-obstacle area by id+category
    (o=218; see the map sensor's deletable_objects). Editing a non-active map
    makes it the active map.
  fields:
    map_id:
      name: Map ID
      description: 0-based map index.
      required: true
      example: 0
      selector:
        number:
          min: 0
          max: 10
          mode: box
    object_id:
      name: Object ID
      description: Cloud object id from the map sensor's deletable_objects.
      required: true
      example: 101
      selector:
        number:
          min: 0
          mode: box
    category:
      name: Category
      description: 0 = zone/no-go/mow-shape, 1 = spot, 2 = patrol/cruise point, 3 = maintenance point, 4 = ignore-obstacle.
      required: true
      example: 0
      selector:
        number:
          min: 0
          max: 10
          mode: box

create_no_go_zone:
  name: Create no-go zone
  description: >
    Create a no-go area / virtual wall on a map (o=215). points are [x, y]
    pairs in map edit-frame metres. Editing a non-active map makes it active.
  fields:
    map_id:
      name: Map ID
      required: true
      example: 0
      selector:
        number:
          min: 0
          max: 10
          mode: box
    shape:
      name: Shape
      required: true
      example: polygon
      selector:
        select:
          options:
            - line
            - polygon
            - circle
    points:
      name: Points
      description: List of [x, y] metre pairs. line=2, polygon>=3, circle=1 (centre).
      required: true
      example: "[[9.65, -0.13], [4.12, -0.13], [4.12, 5.01]]"
      selector:
        object: {}
    radius:
      name: Radius (m)
      description: Circle radius in metres (circle shape only).
      required: false
      example: 1.5
      selector:
        number:
          min: 0
          max: 50
          step: 0.1
          mode: box
    object_id:
      name: Object ID
      description: -1 to create new; an existing object id to edit it in place.
      required: false
      example: -1
      selector:
        number:
          min: -1
          max: 1000000
          mode: box

create_ignore_obstacle:
  name: Create ignore-obstacle area
  description: >
    Create an ignore-obstacle area on a map (o=234, polygon with >=3 points,
    no radius). points are [x, y] pairs in map edit-frame metres. Editing a
    non-active map makes it active.
  fields:
    map_id:
      name: Map ID
      required: true
      example: 0
      selector:
        number:
          min: 0
          max: 10
          mode: box
    points:
      name: Points
      description: List of [x, y] metre pairs (polygon, >=3 points).
      required: true
      example: "[[-2.49, -5.97], [-8.71, -5.97], [-8.71, -0.18]]"
      selector:
        object: {}
    object_id:
      name: Object ID
      description: -1 to create new; an existing object id to edit it in place.
      required: false
      example: -1
      selector:
        number:
          min: -1
          max: 1000000
          mode: box

create_mow_shape:
  name: Create mow-shape
  description: >
    Create a decorative mow-shape on a map (o=215). points are [x, y] pairs in
    map edit-frame metres (square=4 points, other shapes=2-point bbox). Editing
    a non-active map makes it active.
  fields:
    map_id:
      name: Map ID
      required: true
      example: 0
      selector:
        number:
          min: 0
          max: 10
          mode: box
    shape:
      name: Shape
      required: true
      example: heart
      selector:
        select:
          options:
            - square
            - circle
            - heart
            - triangle
            - teardrop
            - mushroom
            - cloud
            - rainbow
    points:
      name: Points
      description: List of [x, y] metre pairs. square=4 points, others=2-point bbox.
      required: true
      example: "[[0.57, -8.39], [-7.97, 0.15]]"
      selector:
        object: {}
    object_id:
      name: Object ID
      description: -1 to create new; an existing object id to edit it in place.
      required: false
      example: -1
      selector:
        number:
          min: -1
          max: 1000000
          mode: box

create_spot:
  name: Create spot
  description: >
    Create (or edit-in-place) a spot mowing area on a map (o=214). points are
    exactly four [x, y] corner pairs in map edit-frame metres (same geometry as
    a no-go rect). Editing a non-active map makes it active.
  fields:
    map_id:
      name: Map ID
      description: 0-based map index. Defaults to the active map when omitted.
      required: false
      example: 0
      selector:
        number:
          min: 0
          max: 10
          mode: box
    points:
      name: Points
      description: List of exactly four [x, y] metre corner pairs.
      required: true
      example: "[[1.0, 1.0], [3.0, 1.0], [3.0, 3.0], [1.0, 3.0]]"
      selector:
        object: {}
    object_id:
      name: Object ID
      description: -1 to create new; an existing spot id to edit it in place.
      required: false
      example: -1
      selector:
        number:
          min: -1
          max: 1000000
          mode: box

create_maintenance_point:
  name: Create maintenance point
  description: >
    Create (or move) a maintenance / clean point on a map (o=224). x, y are map
    edit-frame metres; heading is in radians (default 0; the read map has no
    heading, so a move resets it to 0). Editing a non-active map makes it active.
  fields:
    map_id:
      name: Map ID
      description: 0-based map index. Defaults to the active map when omitted.
      required: false
      example: 0
      selector:
        number:
          min: 0
          max: 10
          mode: box
    x:
      name: X (m)
      description: X coordinate in map edit-frame metres.
      required: true
      example: 2.5
      selector:
        number:
          min: -100
          max: 100
          step: 0.01
          mode: box
    y:
      name: Y (m)
      description: Y coordinate in map edit-frame metres.
      required: true
      example: -1.3
      selector:
        number:
          min: -100
          max: 100
          step: 0.01
          mode: box
    heading:
      name: Heading (rad)
      description: Heading in radians (default 0).
      required: false
      example: 0.0
      selector:
        number:
          min: -3.15
          max: 3.15
          step: 0.01
          mode: box
    object_id:
      name: Object ID
      description: -1 to create new; an existing point id to move it.
      required: false
      example: -1
      selector:
        number:
          min: -1
          max: 1000000
          mode: box

create_patrol_point:
  name: Create patrol point
  description: >
    Create (or move) a patrol / cruise point on a map (o=223). DISTINCT opcode
    from the maintenance point (delete category 2, not 3). x, y are map
    edit-frame metres; heading is in radians (default 0; the read map has no
    heading, so a move resets it to 0). Editing a non-active map makes it active.
  fields:
    map_id:
      name: Map ID
      description: 0-based map index. Defaults to the active map when omitted.
      required: false
      example: 0
      selector:
        number:
          min: 0
          max: 10
          mode: box
    x:
      name: X (m)
      description: X coordinate in map edit-frame metres.
      required: true
      example: 2.5
      selector:
        number:
          min: -100
          max: 100
          step: 0.01
          mode: box
    y:
      name: Y (m)
      description: Y coordinate in map edit-frame metres.
      required: true
      example: -1.3
      selector:
        number:
          min: -100
          max: 100
          step: 0.01
          mode: box
    heading:
      name: Heading (rad)
      description: Heading in radians (default 0).
      required: false
      example: 0.0
      selector:
        number:
          min: -3.15
          max: 3.15
          step: 0.01
          mode: box
    object_id:
      name: Object ID
      description: -1 to create new; an existing point id to move it.
      required: false
      example: -1
      selector:
        number:
          min: -1
          max: 1000000
          mode: box

set_patrol_point_config:
  name: Set patrol point config
  description: >
    Set a patrol point's Number of Patrol Cycles (1/2/3) and Auto-Capture &
    Upload Photos (on/off) — the CRUISED CFG attributes. Standalone write, not
    part of the geometry edit. Read back via the patrol-points sensor / map
    editor (CRUISE.0 device-data).
  fields:
    map_id:
      name: Map ID
      description: 0-based map index. Defaults to the active map when omitted.
      required: false
      example: 0
      selector:
        number: {min: 0, max: 10, mode: box}
    point_id:
      name: Point ID
      description: The patrol point's id (from sensor.dreame_a2_mower_map_N_patrol_points).
      required: true
      example: 3
      selector:
        number: {min: 0, max: 99, mode: box}
    cycles:
      name: Cycles
      description: Number of patrol cycles at this point.
      required: true
      example: 2
      selector:
        select:
          options: ["1", "2", "3"]
    auto_capture:
      name: Auto-capture
      description: Capture & upload photos at this point.
      required: true
      example: true
      selector:
        boolean:

split_zone:
  name: Split zone (DESTRUCTIVE)
  description: >
    DESTRUCTIVE. Split a mowing zone by a line (o=220); clears that zone's
    schedule/prefs. line_start/line_end are [x, y] pairs in map edit-frame
    metres. Editing a non-active map makes it active.
  fields:
    map_id:
      name: Map ID
      required: true
      example: 0
      selector:
        number:
          min: 0
          max: 10
          mode: box
    zone:
      name: Zone ID
      description: Cloud zone id to split.
      required: true
      example: 1
      selector:
        number:
          min: 0
          mode: box
    line_start:
      name: Line start
      description: "[x, y] metre pair where the split line starts."
      required: true
      example: "[-0.19, -11.41]"
      selector:
        object: {}
    line_end:
      name: Line end
      description: "[x, y] metre pair where the split line ends."
      required: true
      example: "[-5.21, -6.22]"
      selector:
        object: {}

merge_zones:
  name: Merge zones (DESTRUCTIVE)
  description: >
    DESTRUCTIVE. Merge two or more mowing zones by id list (o=221); resets the
    merged zones' prefs. Editing a non-active map makes it active.
  fields:
    map_id:
      name: Map ID
      required: true
      example: 0
      selector:
        number:
          min: 0
          max: 10
          mode: box
    zones:
      name: Zone IDs
      description: List of >=2 cloud zone ids to merge.
      required: true
      example: "[2, 1]"
      selector:
        object: {}


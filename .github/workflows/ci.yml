name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  inventory-touch-gate:
    # Fails when a PR modifies protocol- or entity-defining files but
    # leaves the corresponding inventory yaml untouched, unless the PR
    # description includes the opt-out token `inventory-skip-reason:
    # <reason>`. Catches the most common drift mode (code change ships
    # without doc update).
    #
    # Two parallel gates:
    #   - wire/protocol files  → inventory.yaml
    #   - entity platform files → entity-inventory.yaml
    #
    # coordinator.py is excluded — touched too often for unrelated
    # reasons; gating it would create noise.
    #
    # Only runs on pull_request events — push-to-main isn't gated
    # because the contributor history is in the PRs that fed it.
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check protocol/entity-vs-inventory diff
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -u
          # Files whose changes indicate a protocol-shape change that
          # SHOULD be reflected in inventory.yaml.
          PROTOCOL_GLOBS=(
            'custom_components/dreame_a2_mower/mower/error_codes.py'
            'custom_components/dreame_a2_mower/protocol/'
            # Endpoint-DEFINING cloud_client files (new API endpoints must reach
            # inventory.yaml § api_endpoints). Generic transport (_rpc/_auth/_batch)
            # is intentionally excluded. Added after the getDeiviceFile drift, where
            # a new endpoint shipped in _file_bridge.py with no inventory entry.
            # The former single _fetchers.py was split into per-family mixins
            # (P3.5 transport split) and RETIRED in P3.10, so the watch list
            # follows the endpoints into the family files.
            'custom_components/dreame_a2_mower/cloud_client/_state_fetch.py'
            'custom_components/dreame_a2_mower/cloud_client/_device_fetch.py'
            'custom_components/dreame_a2_mower/cloud_client/_messages.py'
            'custom_components/dreame_a2_mower/cloud_client/_media.py'
            'custom_components/dreame_a2_mower/cloud_client/_ota.py'
            'custom_components/dreame_a2_mower/cloud_client/_writers.py'
            'custom_components/dreame_a2_mower/cloud_client/_file_bridge.py'
          )
          # Entity platform files. coordinator.py intentionally absent.
          ENTITY_GLOBS=(
            'custom_components/dreame_a2_mower/switch.py'
            'custom_components/dreame_a2_mower/sensor.py'
            'custom_components/dreame_a2_mower/select.py'
            'custom_components/dreame_a2_mower/number.py'
            'custom_components/dreame_a2_mower/binary_sensor.py'
            'custom_components/dreame_a2_mower/camera.py'
            'custom_components/dreame_a2_mower/button.py'
          )
          WIRE_INVENTORY='custom_components/dreame_a2_mower/inventory.yaml'
          ENTITY_INVENTORY='custom_components/dreame_a2_mower/entity-inventory.yaml'

          changed_files=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")

          # Helper: does the changed-files list contain anything that
          # matches one of the prefixes in $1?
          touches_any() {
            local -n globs=$1
            local f
            for f in "${globs[@]}"; do
              if echo "$changed_files" | grep -qE "^${f//./\\.}"; then
                return 0
              fi
            done
            return 1
          }

          touched_protocol=0; touches_any PROTOCOL_GLOBS && touched_protocol=1
          touched_entities=0; touches_any ENTITY_GLOBS && touched_entities=1

          touched_wire_inv=0
          if echo "$changed_files" | grep -qxF "$WIRE_INVENTORY"; then
            touched_wire_inv=1
          fi
          touched_entity_inv=0
          if echo "$changed_files" | grep -qxF "$ENTITY_INVENTORY"; then
            touched_entity_inv=1
          fi

          has_optout=0
          if echo "${PR_BODY:-}" | grep -qE 'inventory-skip-reason:\s*\S+'; then
            has_optout=1
          fi

          fail=0

          if [ "$touched_protocol" -eq 1 ] && [ "$touched_wire_inv" -eq 0 ] && [ "$has_optout" -eq 0 ]; then
            echo "::error::Protocol files changed without inventory.yaml update."
            echo ""
            echo "Touched protocol files:"
            for g in "${PROTOCOL_GLOBS[@]}"; do
              echo "$changed_files" | grep -E "^${g//./\\.}" | sed 's/^/  - /'
            done
            fail=1
          fi

          if [ "$touched_entities" -eq 1 ] && [ "$touched_entity_inv" -eq 0 ] && [ "$has_optout" -eq 0 ]; then
            echo "::error::Entity platform files changed without entity-inventory.yaml update."
            echo ""
            echo "Touched entity files:"
            for g in "${ENTITY_GLOBS[@]}"; do
              echo "$changed_files" | grep -E "^${g//./\\.}" | sed 's/^/  - /'
            done
            fail=1
          fi

          if [ "$fail" -eq 1 ]; then
            echo ""
            echo "Either:"
            echo "  (a) Update the inventory file(s) above to reflect the change, or"
            echo "  (b) Add an opt-out line to the PR description:"
            echo "      inventory-skip-reason: <one-line reason, e.g. \"refactor only, no semantic change\">"
            exit 1
          fi

          if [ "$has_optout" -eq 1 ] && ( [ "$touched_protocol" -eq 1 ] || [ "$touched_entities" -eq 1 ] ); then
            if [ "$touched_protocol" -eq 1 ] && [ "$touched_wire_inv" -eq 0 ]; then
              echo "::notice::Protocol files changed without inventory.yaml update — opt-out token accepted."
            fi
            if [ "$touched_entities" -eq 1 ] && [ "$touched_entity_inv" -eq 0 ]; then
              echo "::notice::Entity files changed without entity-inventory.yaml update — opt-out token accepted."
            fi
          fi

          echo "Inventory touch gate: OK"

  test-and-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Importing custom_components.dreame_a2_mower triggers __init__.py
          # which transitively pulls the integration's real third-party deps
          # (voluptuous via services, requests via cloud_client, pillow+numpy
          # via rendering, paho-mqtt+aiohttp via the MQTT/view layer,
          # pycryptodome via crypto). Some inventory tests now import the
          # package (e.g. test_control_mode_code_sync imports control_honesty),
          # so the inventory job needs the SAME dep set as full-test-suite —
          # otherwise collection fails with ModuleNotFoundError (e.g. PIL).
          pip install pytest PyYAML voluptuous requests pillow numpy paho-mqtt pycryptodome aiohttp

      - name: Run tool + inventory tests
        run: python -m pytest tests/tools/ tests/inventory/ -v

      - name: Entity-inventory coverage (every entity class is inventoried)
        # Fatal gate: every concrete HA entity class must have an
        # entity-inventory.yaml entry (and no stale entries). Complements the
        # inventory-touch-gate (which only fires on PR diffs) by enforcing
        # completeness on every run.
        run: python tools/inventory/entity_inventory_audit.py

      - name: Inventory schema validation
        run: python tools/inventory/inventory_gen.py --validate-only

      - name: Canonical-doc drift gate
        # The validate-only step above checks inventory.yaml's SCHEMA but never
        # diffs the *rendered* canonical doc, which silently drifted in the past
        # (see CLAUDE.md § "Documentation canonicity"). Regenerate it and fail if
        # the committed copy is stale. Fix locally with:
        #   python tools/inventory/inventory_gen.py
        # then commit docs/research/inventory/generated/g2408-canonical.md.
        run: |
          python tools/inventory/inventory_gen.py
          git diff --exit-code docs/research/inventory/generated/g2408-canonical.md

      - name: Inventory presence audit (notice-only)
        # Coverage tracker: lists protocol/cloud surfaces observed in
        # probe/cloud dumps that have no inventory entry yet (a standing
        # documentation backlog). Notice-only — like the retractions audit —
        # so the backlog doesn't fail the build. The fatal gate for NEW
        # surfaces is the inventory-touch-gate job, which blocks changing
        # protocol/entity files without a matching inventory update.
        continue-on-error: true
        run: python tools/inventory/inventory_audit.py

      - name: Inventory consistency audit
        run: python tools/inventory/inventory_audit.py --consistency

      - name: Outstanding retractions audit (notice-only)
        # Surfaces every inventory entry whose latest verification is a
        # retraction — i.e. a withdrawn claim that hasn't been replaced
        # with a re-verified record yet. Notice-only: never fails the
        # build, just lists them so they don't quietly accumulate.
        run: python tools/inventory/audit_outstanding_retractions.py

  full-test-suite:
    # Runs the ENTIRE tests/ suite — previously only tests/tools/ +
    # tests/inventory/ gated in CI (the test-and-audit job), so the ~120
    # integration / coordinator / render tests never ran here and the safety
    # net in CI was far thinner than the local suite. homeassistant itself is
    # NOT installed; tests/conftest.py stubs the homeassistant.* namespace, so
    # the dependency set is just the integration's real third-party libs (the
    # same set the local .venv-vanilla carries).
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Set up Node 22
        # refactor-v2 P6.5a (R-67): tests/www/*.mjs harnesses (strategy_harness,
        # card_core_harness, projection_parity, map_editor_*, schedule_modal,
        # patrol_attr_panel, wifi_overlay_key, ...) are wrapped by
        # tests/www/test_*.py using @pytest.mark.skipif(shutil.which("node") is
        # None) — without a node binary on PATH they silently SKIP instead of
        # running. The harnesses are dependency-free .mjs (no package.json /
        # npm install needed) — bare `node <harness>.mjs` is sufficient.
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Importing the package (custom_components.dreame_a2_mower) under the
          # stubbed-HA conftest still pulls its real deps: paho-mqtt + aiohttp
          # (via __init__/_camera_views), requests (cloud_client), voluptuous
          # (services), pillow + numpy (rendering), pycryptodome (crypto), and
          # PyYAML. pytest-asyncio runs the async coordinator tests.
          pip install pytest pytest-asyncio PyYAML voluptuous requests pillow numpy paho-mqtt pycryptodome aiohttp

      - name: Run full test suite
        run: python -m pytest tests/ -q

  ruff-f401:
    # refactor-v2 P1 (R-9): unused-import recurrence gate. Import headers
    # rotted to 605 unused imports after the 2026-05 package decompositions
    # (mixins/entities/camera/wifi splits) before this job existed. Only
    # F401 is enforced repo-wide for now; broader lint adoption is a P3+
    # decision. Config: ruff.toml (repo root).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.13"}
      - run: pip install ruff
      - run: ruff check custom_components/

  dev-box-path-gate:
    # refactor-v2 P6.4 (R-47): keeps dev-box absolute paths — this repo's
    # recurring leak class (see the _writers.py `/tmp/probe_cfg_writes.py`
    # docstring incident) — out of shipped code and the README.
    #
    # Scoped to *.py under custom_components/ plus README.md ONLY.
    # inventory.yaml and entity-inventory.yaml are DELIBERATELY excluded:
    # they carry intentional evidence-provenance `/data/claude/...`
    # citations that point at the out-of-tree probe/finding corpus (see
    # CLAUDE.md § fact discipline) — those are load-bearing, not leaks.
    # Restricting the grep to `*.py` files naturally excludes both YAMLs
    # without needing an explicit exclude flag.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check for dev-box paths in shipped files
        run: |
          set -u
          # /tmp/ is anchored to a path boundary (start-of-line or a
          # non-alnum char before it) so it doesn't false-positive on an
          # unrelated substring match like the OSS cloud key segment
          # `iot/tmp/...` — only a real `/tmp/...` path (bare or preceded
          # by a quote/slash/etc.) trips this half of the gate.
          hits=$(grep -rnE "/data/claude/|(^|[^[:alnum:]])/tmp/" \
            --include="*.py" custom_components/dreame_a2_mower/ README.md \
            2>/dev/null || true)
          if [ -n "$hits" ]; then
            echo "::error::Dev-box path(s) leaked into shipped files:"
            echo "$hits"
            exit 1
          fi
          echo "Dev-box path gate: OK"
